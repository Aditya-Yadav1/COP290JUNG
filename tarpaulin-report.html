tart = 0;\r\n        let mut col_start = 0;\r\n        let mut time = 0.0;\r\n        let mut status = String::new();\r\n        let total_rows = 10;\r\n        let total_cols = 10;\r\n        let mut print_enabled = true;\r\n        \r\n        // Set cells\r\n        parse_command(\"A1=10\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        parse_command(\"B1=0\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        \r\n        // Attempt division by zero\r\n        parse_command(\"C1=A1/B1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert!(sheet.data.get(\u0026(0, 2)).unwrap().is_error);\r\n    }\r\n\r\n    #[test]\r\n    fn test_remove_dependency() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut status = String::new();\r\n        let mut sleep_timer = 0;\r\n        \r\n        // Set B1 = 20\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n        \r\n        // Set A1 = B1\r\n        let cell_a1 = CellInfo { row: 0, col: 0 };\r\n        let cell_b1 = CellInfo { row: 0, col: 1 };\r\n        let empty = CellInfo { row: -1, col: -1 };\r\n        \r\n        add_constraints(cell_a1, cell_b1, empty, OpCode::CellEqualsCell, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n        \r\n        // Verify dependency exists\r\n        assert!(sheet.data.get(\u0026(0, 1)).unwrap().dependencies.contains(\u0026(0 * 1000 + 0)));\r\n        \r\n        // Remove dependency\r\n        let cell_a1 = CellInfo { row: 0, col: 0 };\r\n        remove_dependency(\u0026cell_a1, \u0026mut sheet);\r\n        \r\n        // Verify dependency was removed\r\n        assert!(!sheet.data.get(\u0026(0, 1)).unwrap().dependencies.contains(\u0026(0 * 1000 + 0)));\r\n    }\r\n\r\n    // #[test]\r\n    // fn test_sort_sheet() {\r\n    //     let mut sheet = create_test_sheet();\r\n        \r\n    //     // Set up cells in a 2x2 grid\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 0).value = 30;\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 0).value = 10;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n    //     // Sort rows by the values in column A (ascending)\r\n\r\n    //     sort_sheet(\u0026mut sheet, 0, 0, 1, 1, \"A\", true, \"asc\");\r\n        \r\n    //     // After sorting by column A (ascending):\r\n    //     // Row 0 should have the row with the smallest value in column A (was row 1 with value 10)\r\n    //     // Row 1 should have the row with the largest value in column A (was row 0 with value 30)\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 10);\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().value, 40);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 0)).unwrap().value, 30);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 1)).unwrap().value, 20);\r\n        \r\n    //     // Reset the grid\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 0).value = 30;\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 0).value = 10;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n    //     // Sort rows by the values in column B (descending)\r\n    //     sort_sheet(\u0026mut sheet, 0, 0, 1, 1, \"B\", true, \"desc\");\r\n        \r\n    //     // After sorting by column B (descending):\r\n    //     // Row 0 should have the row with the largest value in column B (was row 1 with value 40)\r\n    //     // Row 1 should have the row with the smallest value in column B (was row 0 with value 20)\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 10);\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().value, 40);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 0)).unwrap().value, 30);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 1)).unwrap().value, 20);\r\n        \r\n    //     // Reset the grid\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 0).value = 30;\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 0).value = 10;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n    //     // Sort columns by the values in row 1 (ascending)\r\n    //     sort_sheet(\u0026mut sheet, 0, 0, 1, 1, \"1\", false, \"asc\");\r\n        \r\n    //     // After sorting by row 1 (ascending):\r\n    //     // Column 0 should have the smallest value in row 1 (20, was column 1)\r\n    //     // Column 1 should have the largest value in row 1 (30, was column 0)\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 20);\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().value, 30);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 0)).unwrap().value, 40);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 1)).unwrap().value, 10);\r\n        \r\n    //     // Reset the grid\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 0).value = 30;\r\n    //     get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 0).value = 10;\r\n    //     get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n    //     // Sort columns by the values in row 2 (descending)\r\n    //     sort_sheet(\u0026mut sheet, 0, 0, 1, 1, \"2\", false, \"desc\");\r\n        \r\n    //     // After sorting by row 2 (descending):\r\n    //     // Column 0 should have the largest value in row 2 (40, was column 1)\r\n    //     // Column 1 should have the smallest value in row 2 (10, was column 0)\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 20);\r\n    //     assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().value, 30);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 0)).unwrap().value, 40);\r\n    //     assert_eq!(sheet.data.get(\u0026(1, 1)).unwrap().value, 10);\r\n    // }\r\n    \r\n    #[test]\r\nfn test_compute_range_func() {\r\n    let mut sheet = create_test_sheet();\r\n    let mut status = String::new();\r\n    \r\n    // Create a test range\r\n    get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n    get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n    get_or_create_cell(\u0026mut sheet, 1, 0).value = 30;\r\n    get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n    \r\n    // Test range functions\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::Sum, 0, 0, 1, 1, \u0026mut status), 100);\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::Min, 0, 0, 1, 1, \u0026mut status), 10);\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::Max, 0, 0, 1, 1, \u0026mut status), 40);\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::Avg, 0, 0, 1, 1, \u0026mut status), 25);\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::Stdev, 0, 0, 1, 1, \u0026mut status), 11);\r\n    \r\n    // Test invalid range\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::Sum, 1, 0, 0, 1, \u0026mut status), -1);\r\n    assert_eq!(status, \"err\");\r\n    \r\n    // Test invalid op_code\r\n    status = String::new();\r\n    assert_eq!(compute_range_func(\u0026sheet, OpCode::NoConstraint, 0, 0, 1, 1, \u0026mut status), -1);\r\n}\r\n\r\n#[test]\r\nfn test_check_cycle() {\r\n    let mut avl_tree = HashMap::new();\r\n    avl_tree.insert(1000, 0); // Key for cell at (0,1)\r\n    \r\n    // Cell1 is already in the tree, should detect cycle\r\n    let cell1 = CellInfo { row: 0, col: 1 };\r\n    let cell2 = CellInfo { row: 1, col: 1 };\r\n    assert!(check_cycle(\u0026avl_tree, \u0026cell1, \u0026cell2));\r\n    \r\n    // Cell2 is not already in the tree, should not detect cycle\r\n    let cell1 = CellInfo { row: 2, col: 2 };\r\n    let cell2 = CellInfo { row: 1, col: 1 };\r\n    assert!(!check_cycle(\u0026avl_tree, \u0026cell1, \u0026cell2));\r\n    \r\n    // Add the key for cell2\r\n    avl_tree.insert(1001, 0); // Key for cell at (1,1)\r\n    assert!(check_cycle(\u0026avl_tree, \u0026cell1, \u0026cell2));\r\n    \r\n    // Test empty cell2\r\n    let cell1 = CellInfo { row: 2, col: 2 };\r\n    let cell2 = CellInfo { row: -1, col: -1 };\r\n    assert!(!check_cycle(\u0026avl_tree, \u0026cell1, \u0026cell2));\r\n}\r\n\r\n#[test]\r\nfn test_check_cycle_range_funcs() {\r\n    let mut avl_tree = HashMap::new();\r\n    avl_tree.insert(1001, 0); // Key for cell at (1,1)\r\n    \r\n    // Range includes the cell in avl_tree\r\n    let cell1 = CellInfo { row: 0, col: 0 };\r\n    let cell2 = CellInfo { row: 2, col: 2 };\r\n    assert!(check_cycle_range_funcs(\u0026avl_tree, \u0026cell1, \u0026cell2));\r\n    \r\n    // Range does not include the cell in avl_tree\r\n    let cell1 = CellInfo { row: 3, col: 3 };\r\n    let cell2 = CellInfo { row: 4, col: 4 };\r\n    assert!(!check_cycle_range_funcs(\u0026avl_tree, \u0026cell1, \u0026cell2));\r\n}\r\n\r\n// #[test]\r\n// fn test_update_dependencies() {\r\n//     let mut sheet = create_test_sheet();\r\n//     let mut status = String::new();\r\n//     let mut sleep_timer = 0;\r\n    \r\n//     // Set up a dependency\r\n//     get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n    \r\n//     // B1 = A1\r\n//     let cell_b1 = CellInfo { row: 0, col: 1 };\r\n//     let cell_a1 = CellInfo { row: 0, col: 0 };\r\n//     let empty = CellInfo { row: -1, col: -1 };\r\n    \r\n//     add_constraints(cell_b1, cell_a1, empty, OpCode::CellEqualsCell, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n    \r\n//     // Update dependency A1 to A2\r\n//     update_dependencies(0, 0, 1, 0, \u0026mut sheet);\r\n    \r\n//     // B1 should now depend on A2 instead of A1\r\n//     assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().cell1.row, 1);\r\n//     assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().cell1.col, 0);\r\n// }\r\n\r\n// #[test]\r\n// fn test_change_dependecy_set() {\r\n//     let mut sheet = create_test_sheet();\r\n//     let mut status = String::new();\r\n//     let mut sleep_timer = 0;\r\n    \r\n//     // Set B1 = 20\r\n//     get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n    \r\n//     // Set A1 = B1\r\n//     let cell_a1 = CellInfo { row: 0, col: 0 };\r\n//     let cell_b1 = CellInfo { row: 0, col: 1 };\r\n//     let empty = CellInfo { row: -1, col: -1 };\r\n    \r\n//     add_constraints(cell_a1, cell_b1, empty, OpCode::CellEqualsCell, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n    \r\n//     // Change the dependency set for B1\r\n//     if let Some(new_cell) = sheet.data.get_mut(\u0026(0, 1)) {\r\n//         change_dependecy_set(new_cell, \u0026mut sheet, false, 1, 1, 0, 1);\r\n//     }\r\n    \r\n//     // A1 should now depend on cell at position (1,1) instead of (0,1)\r\n//     assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().cell1.row, 1);\r\n//     assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().cell1.col, 1);\r\n// }\r\n\r\n#[test]\r\nfn test_string_cells_and_operations() {\r\n    let mut sheet = create_test_sheet();\r\n    let mut row_start = 0;\r\n    let mut col_start = 0;\r\n    let mut time = 0.0;\r\n    let mut status = String::new();\r\n    let total_rows = 10;\r\n    let total_cols = 10;\r\n    let mut print_enabled = true;\r\n    \r\n    // Set up string cells\r\n    parse_command(\"A1=\\\"Hello\\\"\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    parse_command(\"B1=\\\"World\\\"\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    \r\n    // Check string values\r\n    assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().string, Some(\"Hello\".to_string()));\r\n    assert_eq!(sheet.data.get(\u0026(0, 1)).unwrap().string, Some(\"World\".to_string()));\r\n    \r\n    // Try to perform operations with string cells (should result in error)\r\n    parse_command(\"C1=A1+B1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    assert!(sheet.data.get(\u0026(0, 2)).unwrap().is_error);\r\n}\r\n\r\n#[test]\r\nfn test_sleep_commands() {\r\n    let mut sheet = create_test_sheet();\r\n    let mut row_start = 0;\r\n    let mut col_start = 0;\r\n    let mut time = 0.0;\r\n    let mut status = String::new();\r\n    let total_rows = 10;\r\n    let total_cols = 10;\r\n    let mut print_enabled = true;\r\n    \r\n    // Test SLEEP with a constant\r\n    parse_command(\"A1=SLEEP(1)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 1);\r\n    assert_eq!(time, 1.0);\r\n    \r\n    // Test SLEEP with a cell reference\r\n    parse_command(\"B1=2\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    parse_command(\"A2=SLEEP(B1)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    assert_eq!(sheet.data.get(\u0026(1, 0)).unwrap().op_code, OpCode::Sleep);\r\n    assert_eq!(time, 2.0);  // 1 from the first sleep + 2 from the second\r\n}\r\n\r\n#[test]\r\nfn test_error_handling() {\r\n    let mut sheet = create_test_sheet();\r\n    let mut row_start = 0;\r\n    let mut col_start = 0;\r\n    let mut time = 0.0;\r\n    let mut status = String::new();\r\n    let total_rows = 10;\r\n    let total_cols = 10;\r\n    let mut print_enabled = true;\r\n    \r\n    // Test invalid cell reference\r\n    parse_command(\"Z99=10\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    assert_eq!(status, \"Invalid cmd\");\r\n    \r\n    // Test circular reference\r\n    parse_command(\"A1=B1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    status = String::new();\r\n    parse_command(\"B1=A1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    assert_eq!(status, \"circular error\");\r\n    \r\n    // Test invalid range in function\r\n    parse_command(\"C1=SUM(B2:A1)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n    assert_eq!(status, \"Invalid cmd\");\r\n}\r\n}","traces":[],"covered":0,"coverable":0},{"path":["/","mnt","c","Users","deepa","Desktop","290keChode","COP290JUNG","src","ui","app_impl.rs"],"content":"use crate::sheet_functions::{CellInfo, col_num_to_col_name,get_or_create_cell};\r\nuse crate::parser; \r\nuse serde::{Serialize, Deserialize};\r\nuse crate::sheet_functions::{self,Sheet,Cell};\r\nuse crate::ui::themes::Theme;\r\nuse crate::ui::themes::THEMES;\r\nuse crate::ui::utils;\r\nuse std::cell;\r\nuse std::string::String; \r\nuse crate::sheet_functions::OpCode;\r\n\r\n#[derive(Clone, Serialize, Deserialize)]\r\npub struct Sheets {\r\n    pub sheet: Sheet,\r\n    pub name: String,\r\n}\r\n\r\n#[derive(Clone,Debug)]\r\npub enum Action {\r\n    // NewSheet {\r\n    //     sheet: Sheets,\r\n    //     index: usize,\r\n    // },\r\n    // DeleteSheet {\r\n    //     sheet: Sheets,\r\n    //     index: usize,\r\n    // },\r\n    // ClearSheet {\r\n    //     sheet_index: usize,\r\n    //     old_data: Vec\u003cVec\u003cCell\u003e\u003e,\r\n    // },\r\n    // Deleted {\r\n    //     sheet_index: usize,\r\n    //     row: i16,\r\n    //     col: i16,\r\n    //     deleted_cell: Cell,\r\n    // },\r\n    Inserted {\r\n        sheet_index : usize,\r\n        row : i16,\r\n        col : i16,\r\n        previous_cell: Cell,\r\n    },\r\n    CutAction{\r\n        sheet_index: usize,\r\n        row1: i16,\r\n        col1: i16,\r\n        previous_cell1: Cell,\r\n        row2: i16,\r\n        col2: i16,\r\n        previous_cell2: Cell,\r\n    },//1 -\u003e cut from here , 2-\u003e pasted here\r\n    FindAndReplace {\r\n        sheet_index: usize,\r\n        changes: Vec\u003c(usize, usize, Cell, Cell, String)\u003e, // (row, col, old_cell, new_cell, command)\r\n    },\r\n    Sort{\r\n        sheet_index: usize,\r\n        changes: Vec\u003cVec\u003cCell\u003e\u003e,\r\n        row1: i32,\r\n        col1: i32,\r\n        row2: i32,\r\n        col2: i32,\r\n    }\r\n}\r\n\r\n#[derive(Clone,PartialEq)]\r\npub enum CutCopy{\r\n    Cut,\r\n    Copied,\r\n}\r\n\r\n#[derive(Debug, PartialEq)]\r\npub enum Mode { Normal, Insert }\r\n\r\n#[derive(Debug, PartialEq)]\r\npub enum Menu {\r\n    Save,\r\n    Open,\r\n    Theme,\r\n    NewSheet,\r\n    DeleteSheet,\r\n    Font,\r\n    FindAndReplace,\r\n    PlotGraph,\r\n    Sort,\r\n    SelectCell,\r\n    None,\r\n}\r\n\r\npub struct SpreadsheetApp {\r\n    pub sheets: Vec\u003cSheets\u003e,\r\n    pub current_sheet_index: usize,\r\n    pub formula: String,\r\n    pub status: String,\r\n    pub current_font_index: usize,\r\n    pub mode: Mode,\r\n    pub selected_cell: Option\u003c(usize, usize)\u003e,\r\n    pub row_start: i32,\r\n    pub col_start: i32,\r\n    pub time: f32,\r\n    pub timer: i32,\r\n    pub editing_value: String,\r\n    pub is_editing: bool,\r\n    pub show_menu: Menu,\r\n    pub save_filename: String,\r\n    pub open_filename: String,\r\n    pub theme: Theme,\r\n    pub new_sheet_rows: String,\r\n    pub new_sheet_cols: String,\r\n    pub new_sheet_name: String,\r\n    pub undo_stack: Vec\u003cAction\u003e,\r\n    pub redo_stack: Vec\u003cAction\u003e,\r\n    pub clipboard: Option\u003c(Cell,CutCopy,i16,i16)\u003e,\r\n    pub find_text: String,\r\n    pub replace_text: String,\r\n    pub cut_copied_cell: Option\u003c(i16,i16)\u003e,\r\n    pub plot_column1: String, \r\n    pub plot_column2: String, \r\n    pub plot_row_start: String, \r\n    pub plot_row_end: String, \r\n    pub show_plot: bool, \r\n    pub sort_range_start: String,\r\n    pub sort_range_end: String,\r\n    pub sort_col_row : String,\r\n    pub ascending : bool,\r\n    pub input_select_cell : String,\r\n}\r\n\r\n\r\n\r\n\r\n\r\nimpl SpreadsheetApp {\r\n    pub fn new(sheets: Vec\u003cSheets\u003e) -\u003e Self {\r\n        Self {\r\n            sheets,\r\n            current_sheet_index: 0,\r\n            formula: String::new(),\r\n            status: \"ok\".into(),\r\n            mode: Mode::Normal,\r\n            selected_cell: None,\r\n            current_font_index: 0,\r\n            row_start: 0,\r\n            col_start: 0,\r\n            time: 0.0,\r\n            timer: 0,\r\n            editing_value: String::new(),\r\n            is_editing: false,\r\n            show_menu: Menu::None,\r\n            save_filename: String::from(\"sheet\"),\r\n            open_filename: String::new(),\r\n            theme: THEMES[0].clone(),\r\n            new_sheet_rows: String::new(),\r\n            new_sheet_cols: String::new(),\r\n            new_sheet_name: String::new(),\r\n            undo_stack: Vec::new(),\r\n            redo_stack: Vec::new(),\r\n            clipboard: None,\r\n            find_text: String::new(),\r\n            replace_text: String::new(),\r\n            cut_copied_cell : None,\r\n            plot_column1: String::new(),\r\n            plot_column2: String::new(),\r\n            plot_row_start: String::new(),\r\n            plot_row_end: String::new(),\r\n            show_plot: false,\r\n            sort_range_start: String::new(),\r\n            sort_range_end: String::new(),\r\n            sort_col_row: String::new(),\r\n            ascending: true,\r\n            input_select_cell: String::new(),\r\n        }\r\n    }\r\n\r\n    pub fn find_and_replace(\u0026mut self) {\r\n        self.clear_clipboard();\r\n        let mut sheet = \u0026mut self.sheets[self.current_sheet_index].sheet;\r\n        let mut changes = Vec::new();\r\n        let find_text = self.find_text.clone();\r\n        let replace_text = self.replace_text.clone();\r\n        let mut is_num;\r\n        let num_row=sheet.rows;\r\n        let num_col=sheet.cols;\r\n        for((row,col),cell) in sheet.data.clone().iter(){\r\n                let cell_content = if let Some(s) = \u0026cell.string {\r\n                    is_num=false;\r\n                    s.clone()\r\n                } else if cell.is_error {\r\n                    is_num=false;\r\n                    \"Err\".to_string()\r\n                } else {\r\n                    is_num=true;\r\n                    cell.value.to_string()\r\n                };\r\n\r\n                if cell_content == find_text \u0026\u0026 (cell.op_code == OpCode::NoConstraint || cell.op_code == OpCode::String) {\r\n                    \r\n                    let old_cell = cell.clone();\r\n                    let command;\r\n                    if !is_num{\r\n                        command = format!(\"{}{}=\\\"{}\\\"\", col_num_to_col_name(*col as i32), row + 1, replace_text);\r\n                    }\r\n                    else{\r\n                        command = format!(\"{}{}={}\", col_num_to_col_name(*col as i32), row + 1, replace_text);\r\n                    }\r\n                    sheet_functions::remove_dependency(\r\n                        \u0026CellInfo {\r\n                            row: *row as i16,\r\n                            col: *col as i16,\r\n                        },\r\n                        sheet,\r\n                    );\r\n                    parser::parse_command(\r\n                        \u0026command,\r\n                        \u0026mut self.row_start,\r\n                        \u0026mut self.col_start,\r\n                        \u0026mut self.time,\r\n                        \u0026mut self.status,\r\n                        \u0026num_row,\r\n                        \u0026num_col,\r\n                        \u0026 mut sheet,\r\n                        \u0026mut true,\r\n                    );\r\n                    let new_cell = get_or_create_cell(sheet, *row as i32, *col as i32).clone();\r\n                    changes.push(( *row as usize, *col as usize, old_cell, new_cell, command));\r\n                }\r\n            }\r\n        \r\n\r\n        if !changes.is_empty() {\r\n            let len = changes.len();\r\n            self.undo_stack.push(Action::FindAndReplace {\r\n                sheet_index: self.current_sheet_index,\r\n                changes,\r\n            });\r\n            self.redo_stack.clear();\r\n            let sorted = sheet_functions::topological_sort(\r\n                \u0026mut std::collections::HashMap::new(),\r\n                sheet,\r\n            );\r\n            for i in sorted {\r\n                let r = i % 1000;\r\n                let c = i / 1000;\r\n                sheet_functions::recalculate(sheet, r as usize, c as usize, \u0026mut self.timer);\r\n            }\r\n            self.status = format!(\"Replaced {} instances\", len);\r\n        } else {\r\n            self.status = \"No matches found\".to_string();\r\n        }\r\n    }\r\n\r\n    pub fn undo(\u0026mut self) {\r\n        if self.undo_stack.is_empty() {\r\n            self.status = \"Nothing to undo\".to_string();\r\n            return;\r\n        }\r\n        self.clear_clipboard();\r\n        if let Some(action) = self.undo_stack.pop() {\r\n            match action {\r\n                Action::Inserted {sheet_index,row,col,previous_cell} =\u003e {\r\n                    utils::insert_undo_redo(sheet_index, row, col, previous_cell,self,false);\r\n                    self.status = \"Undone cell edit\".to_string();\r\n                }\r\n                Action::CutAction {sheet_index,row1,col1,previous_cell1,row2,col2,previous_cell2} =\u003e {\r\n                    utils::cut_undo_redo(sheet_index, row1, col1, previous_cell1, row2, col2, previous_cell2,self,false);\r\n                    self.status = \"Undone cut\".to_string();\r\n                }\r\n                // Action::Deleted { sheet_index, row, col, deleted_cell } =\u003e {\r\n                //     // utils::delete_cell_and_update_dependencies(sheet_index, row, col, deleted_cell, \u0026mut self);\r\n                //     self.status = \"Undone delete\".to_string();\r\n                // }\r\n                Action::FindAndReplace { sheet_index, changes } =\u003e {\r\n                    let mut sheet = \u0026mut self.sheets[sheet_index].sheet;\r\n                    let sheet1 = sheet.clone();\r\n                    let mut redo_changes = Vec::new();\r\n                    for (row, col, old_cell, _, command) in changes {\r\n                        let original_cmd = if old_cell.string.is_some() {\r\n                            format!(\"{}{}=\\\"{}\\\"\", col_num_to_col_name(col as i32), row + 1, old_cell.string.as_ref().unwrap())\r\n                        } else if old_cell.is_error {\r\n                            format!(\"{}{}=Err\", col_num_to_col_name(col as i32), row + 1)\r\n                        } else {\r\n                            format!(\"{}{}=\\\"{}\\\"\", col_num_to_col_name(col as i32), row + 1, old_cell.value)\r\n                        };\r\n                        sheet_functions::remove_dependency(\r\n                            \u0026CellInfo {\r\n                                row: row as i16,\r\n                                col: col as i16,\r\n                            },\r\n                            sheet,\r\n                        );\r\n                        parser::parse_command(\r\n                            \u0026original_cmd,\r\n                            \u0026mut self.row_start,\r\n                            \u0026mut self.col_start,\r\n                            \u0026mut self.time,\r\n                            \u0026mut self.status,\r\n                            \u0026sheet1.rows,\r\n                            \u0026sheet1.cols,\r\n                            \u0026mut sheet,\r\n                            \u0026mut true,\r\n                        );\r\n                        let new_cell_after_undo = get_or_create_cell(sheet, row as i32, col as i32).clone();\r\n                        redo_changes.push((row, col, old_cell.clone(), new_cell_after_undo, command));\r\n                    }\r\n                    self.redo_stack.push(Action::FindAndReplace {\r\n                        sheet_index,\r\n                        changes: redo_changes,\r\n                    });\r\n                    let sorted = sheet_functions::topological_sort(\r\n                        \u0026mut std::collections::HashMap::new(),\r\n                        sheet,\r\n                    );\r\n                    for i in sorted {\r\n                        let r = i % 1000;\r\n                        let c = i / 1000;\r\n                        sheet_functions::recalculate(\r\n                            sheet,\r\n                            r as usize,\r\n                            c as usize,\r\n                            \u0026mut self.timer,\r\n                        );\r\n                    }\r\n                    self.status = \"Undone find and replace\".to_string();\r\n                }\r\n                Action::Sort{sheet_index,changes,row1,col1,row2,col2} =\u003e {\r\n\r\n                    utils::sort_add_to_stack(sheet_index, col1, row1, col2, row2, self, true);\r\n                    for i in row1..(row2 + 1){\r\n                        for j in col1..(col2 + 1){\r\n                            let cell = get_or_create_cell(\u0026mut self.sheets[self.current_sheet_index].sheet, i, j);\r\n                            *cell = changes[(i - row1) as usize][(j - col1) as usize].clone();\r\n                        }\r\n                    }\r\n                    self.status = \"Undone sort\".to_string();\r\n                }\r\n            }\r\n        } else {\r\n            self.status = \"Nothing to undo\".to_string();\r\n        }\r\n    }\r\n\r\n    pub fn redo(\u0026mut self) {\r\n        if self.redo_stack.is_empty() {\r\n            self.status = \"Nothing to redo\".to_string();\r\n            return;\r\n        }\r\n        self.clear_clipboard();\r\n        if let Some(action) = self.redo_stack.pop() {\r\n            match action {\r\n                Action::Inserted {sheet_index,row,col,previous_cell} =\u003e {\r\n                    utils::insert_undo_redo(sheet_index, row, col, previous_cell,self,true);\r\n                    self.status = \"Redone cell edit\".to_string();\r\n                }\r\n                Action::CutAction {sheet_index,row1,col1,previous_cell1,row2,col2,previous_cell2} =\u003e {\r\n                    utils::cut_undo_redo(sheet_index, row1, col1, previous_cell1, row2, col2, previous_cell2,self,true);\r\n                    self.status = \"Redone cut\".to_string();\r\n                }\r\n                Action::FindAndReplace { sheet_index, changes } =\u003e {\r\n                    let mut sheet = \u0026mut self.sheets[sheet_index].sheet;\r\n                    let  sheet1 = sheet.clone();\r\n                    let mut undo_changes = Vec::new();\r\n                    for (row, col, _, _, command) in changes {\r\n                        let prev_cell = get_or_create_cell(sheet, row as i32, col as i32).clone();\r\n                        sheet_functions::remove_dependency(\r\n                            \u0026CellInfo {\r\n                                row: row as i16,\r\n                                col: col as i16,\r\n                            },\r\n                            sheet,\r\n                        );\r\n                        parser::parse_command(\r\n                            \u0026command,\r\n                            \u0026mut self.row_start,\r\n                            \u0026mut self.col_start,\r\n                            \u0026mut self.time,\r\n                            \u0026mut self.status,\r\n                            \u0026sheet1.rows,\r\n                            \u0026sheet1.cols,\r\n                            \u0026mut sheet,\r\n                            \u0026mut true,\r\n                        );\r\n                        let new_cell_after_redo = get_or_create_cell(sheet, row as i32, col as i32).clone();\r\n                        undo_changes.push((row, col, prev_cell, new_cell_after_redo, command));\r\n                    }\r\n                    self.undo_stack.push(Action::FindAndReplace {\r\n                        sheet_index,\r\n                        changes: undo_changes,\r\n                    });\r\n                    let sorted = sheet_functions::topological_sort(\r\n                        \u0026mut std::collections::HashMap::new(),\r\n                        sheet,\r\n                    );\r\n                    for i in sorted {\r\n                        let r = i % 1000;\r\n                        let c = i / 1000;\r\n                        sheet_functions::recalculate(\r\n                            sheet,\r\n                            r as usize,\r\n                            c as usize,\r\n                            \u0026mut self.timer,\r\n                        );\r\n                    }\r\n                    self.status = \"Redone find and replace\".to_string();\r\n                }\r\n                Action::Sort{sheet_index,changes,row1,col1,row2,col2} =\u003e {\r\n                    utils::sort_add_to_stack(sheet_index, col1, row1, col2, row2, self, false);\r\n                    for i in row1..(row2 + 1){\r\n                        for j in col1..(col2 + 1){\r\n                            let cell = get_or_create_cell(\u0026mut self.sheets[sheet_index].sheet, i, j);\r\n                            *cell = changes[(i - row1) as usize][(j - col1) as usize].clone();\r\n                        }\r\n                    }\r\n                    self.status = \"Redone sort\".to_string();\r\n                }\r\n            }\r\n        } else {\r\n            self.status = \"Nothing to redo\".to_string();\r\n        }\r\n    }\r\n\r\n    pub fn clear_clipboard(\u0026mut self) {\r\n        self.clipboard = None;\r\n        self.cut_copied_cell = None;\r\n    }\r\n\r\n    pub fn create_new_sheet(\u0026mut self,rows: i32,cols: i32) {\r\n        let new_sheet = Sheet::new(rows, cols);\r\n        let sheet_struct = Sheets {\r\n            sheet: new_sheet.clone(),\r\n            name: self.new_sheet_name.clone(),\r\n        };\r\n        self.sheets.push(sheet_struct.clone());\r\n        let new_index = self.sheets.len() - 1;\r\n        self.current_sheet_index = new_index;\r\n        self.redo_stack.clear();\r\n        self.show_menu = Menu::None;\r\n        self.status = String::from(\"Sheet created successfully\");\r\n        self.new_sheet_name = String::new();\r\n    }\r\n}","traces":[],"covered":0,"coverable":0},{"path":["/","mnt","c","Users","deepa","Desktop","290keChode","COP290JUNG","src","ui","fonts.rs"],"content":"use egui::{FontFamily, FontId, TextStyle}; \r\n\r\n#[derive(Clone)]\r\npub struct FontOption {\r\n    pub name: \u0026'static str,\r\n    pub family_type: FontFamilyType,\r\n    pub path: Option\u003c\u0026'static [u8]\u003e,\r\n    pub size: f32,\r\n}\r\n\r\n#[derive(Clone, Copy)]\r\npub enum FontFamilyType {\r\n    Proportional,\r\n    Monospace, \r\n}\r\n\r\npub const FONTS: [FontOption; 2] = [\r\n    FontOption {\r\n        name: \"Default\",\r\n        family_type: FontFamilyType::Proportional,\r\n        path: None,\r\n        size: 14.0,\r\n    },\r\n    FontOption {\r\n        name: \"Monospace\",\r\n        family_type: FontFamilyType::Monospace,\r\n        path: None,\r\n        size: 14.0,\r\n    },\r\n];\r\n\r\nimpl FontOption {\r\n    pub fn get_family(\u0026self) -\u003e FontFamily {\r\n        match self.family_type {\r\n            FontFamilyType::Proportional =\u003e FontFamily::Proportional,\r\n            FontFamilyType::Monospace =\u003e FontFamily::Monospace,\r\n             \r\n        }\r\n    }\r\n}\r\n\r\npub fn setup_custom_fonts(ctx: \u0026egui::Context, font_option: \u0026FontOption) {\r\n    let mut fonts = egui::FontDefinitions::default();\r\n    let family = font_option.get_family();\r\n\r\n    if let Some(font_data) = font_option.path {\r\n        let font_name = match font_option.family_type { \r\n            _ =\u003e \"custom_font\".to_string(),\r\n        };\r\n\r\n        fonts.font_data.insert(font_name.clone(), egui::FontData::from_static(font_data));\r\n\r\n        match font_option.family_type {\r\n            FontFamilyType::Proportional | FontFamilyType::Monospace =\u003e {\r\n                fonts.families\r\n                    .get_mut(\u0026family)\r\n                    .unwrap()\r\n                    .insert(0, font_name);\r\n            } \r\n        }\r\n    }\r\n\r\n    let text_styles = [\r\n        (TextStyle::Heading, font_option.size + 4.0),\r\n        (TextStyle::Body, font_option.size),\r\n        (TextStyle::Monospace, font_option.size),\r\n        (TextStyle::Button, font_option.size),\r\n        (TextStyle::Small, font_option.size - 2.0),\r\n    ];\r\n\r\n    let mut style = (*ctx.style()).clone();\r\n    for (text_style, size) in text_styles {\r\n        style\r\n            .text_styles\r\n            .insert(text_style, FontId::new(size, family.clone()));\r\n    }\r\n\r\n    ctx.set_fonts(fonts);\r\n    ctx.set_style(style);\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["/","mnt","c","Users","deepa","Desktop","290keChode","COP290JUNG","src","ui","menu.rs"],"content":"use crate::ui::app_impl::{Menu, Action, SpreadsheetApp, CutCopy};\r\nuse crate::ui::themes::THEMES;\r\nuse crate::sheet_functions::{self, CellInfo, col_name_to_col_num, get_or_create_cell};\r\nuse crate::sheet_functions::OpCode;\r\nuse OpCode :: *;\r\nuse std::collections::HashSet;\r\nuse crate::ui::utils::{load_all_sheets, save_all_sheets, convert_to_csv, open_csv,sort_button_parser};\r\nuse egui_plot::{Line, PlotPoints, Plot};\r\nuse crate::ui::fonts::FONTS;\r\nuse std::string::String ;\r\n\r\n\r\npub fn cut(app: \u0026mut SpreadsheetApp) {\r\n    if let Some((row, col)) = app.selected_cell {\r\n        let cell = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet, row as i32, col as i32);\r\n        let old_cell =cell.clone();\r\n        app.clipboard = Some((old_cell, CutCopy::Cut, row as i16, col as i16));\r\n        app.cut_copied_cell = Some((row as i16, col as i16));\r\n        app.status = \"Cut\".to_string();\r\n    } else {\r\n        app.status = \"No cell selected\".to_string();\r\n    }\r\n}\r\n\r\npub fn copy(app: \u0026mut SpreadsheetApp) {\r\n    if let Some((row, col)) = app.selected_cell {\r\n        let get_cell = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet, row as i32, col as i32);\r\n        let mut cell = get_cell.clone();\r\n        cell.dependencies = HashSet::new();\r\n        cell.cell1 = CellInfo { row: -1, col: -1 };\r\n        cell.cell2 = CellInfo { row: -1, col: -1 };\r\n        cell.op_code = NoConstraint;\r\n        app.clipboard = Some((cell, CutCopy::Copied, row as i16, col as i16));\r\n        app.cut_copied_cell = Some((row as i16, col as i16));\r\n        app.status = \"Copied\".to_string();\r\n    } else {\r\n        app.status = \"No cell selected\".to_string();\r\n    }\r\n}\r\n\r\npub fn paste(app: \u0026mut SpreadsheetApp) {\r\n    if let Some((row, col)) = app.selected_cell {\r\n        if let Some((cell, cut_copy, old_row, old_col)) = app.clipboard.clone() { \r\n            let old_cell1 = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet, old_row as i32, old_col as i32).clone();\r\n            let old_cell2 = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,row as i32,col as i32).clone();\r\n\r\n            if cut_copy == CutCopy::Cut {\r\n                let mut new_cell1 = old_cell1.clone();\r\n                new_cell1.value = 0;\r\n                new_cell1.string = None;\r\n                new_cell1.is_error = false;\r\n                new_cell1.op_code = NoConstraint;\r\n                new_cell1.cell1 = CellInfo { row: -1, col: -1 };\r\n                new_cell1.cell2 = CellInfo { row: -1, col: -1 };\r\n                let depended_cell1 = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,old_row as i32,old_col as i32).cell1.clone();\r\n                let depended_cell2 = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,old_row as i32,old_col as i32).cell2.clone();\r\n                if depended_cell1.row != -1 \u0026\u0026 depended_cell1.col != -1 {\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,depended_cell1.row as i32,depended_cell1.col as i32).dependencies.remove(\u0026(old_col as i32 * 1000 + old_row as i32));\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,depended_cell1.row as i32,depended_cell1.col as i32).dependencies.insert(col as i32 * 1000 + row as i32);\r\n                }\r\n                if depended_cell2.row != -1 \u0026\u0026 depended_cell2.col != -1 {\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,depended_cell2.row as i32,depended_cell2.col as i32).dependencies.remove(\u0026(old_col as i32 * 1000 + old_row as i32));\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,depended_cell2.row as i32,depended_cell2.col as i32).dependencies.insert(col as i32 * 1000 + row as i32);\r\n                }\r\n\r\n                sheet_functions::remove_dependency(\u0026CellInfo { row: row as i16, col: col as i16 }, \u0026mut app.sheets[app.current_sheet_index].sheet);\r\n                \r\n                *get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,old_row as i32,old_col as i32) = new_cell1.clone();\r\n                sheet_functions::change_dependecy_set(\u0026mut new_cell1, \u0026mut app.sheets[app.current_sheet_index].sheet, false , row as i16,col as i16,old_row as i16,old_col as i16);\r\n                let mut new_cell2 = old_cell1.clone();\r\n                sheet_functions::change_dependecy_set(\u0026mut new_cell2, \u0026mut app.sheets[app.current_sheet_index].sheet, true, row as i16,col as i16,old_row as i16,old_col as i16);\r\n                sheet_functions::update_dependencies(old_row, old_col, row as i16, col as i16, \u0026mut app.sheets[app.current_sheet_index].sheet);\r\n                for dependency in old_cell2.dependencies.clone() {\r\n                    let dependency_row = dependency % 1000;\r\n                    let dependency_col = dependency / 1000;\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,dependency_row as i32,dependency_col as i32).value = 0;\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,dependency_row as i32,dependency_col as i32).is_error = true;\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,dependency_row as i32,dependency_col as i32).string = None;\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,dependency_row as i32,dependency_col as i32).op_code = NoConstraint;\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,dependency_row as i32,dependency_col as i32).cell1 = CellInfo { row: -1, col: -1 };\r\n                    get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,dependency_row as i32,dependency_col as i32).cell2 = CellInfo { row: -1, col: -1 };\r\n                    sheet_functions::remove_dependency(\u0026CellInfo { row: dependency_row as i16, col: dependency_col as i16 }, \u0026mut app.sheets[app.current_sheet_index].sheet);\r\n                }\r\n                *get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,row as i32,col as i32) = new_cell2;\r\n                *get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,old_row as i32,old_col as i32) = new_cell1;\r\n                sheet_functions::recalculate_dependecy(CellInfo { row: old_row as i16, col: old_col as i16 }, \u0026mut app.sheets[app.current_sheet_index].sheet);\r\n                app.redo_stack.clear();\r\n                app.undo_stack.push(Action::CutAction {\r\n                    sheet_index: app.current_sheet_index,\r\n                    row1: old_row as i16,\r\n                    col1: old_col as i16,\r\n                    previous_cell1: old_cell1.clone(),\r\n                    row2: row as i16,\r\n                    col2: col as i16,\r\n                    previous_cell2: old_cell2.clone(),\r\n                });\r\n                app.clipboard = None;\r\n            }\r\n            if cut_copy == CutCopy::Copied {\r\n                let mut new_cell = cell.clone();\r\n                new_cell.dependencies = old_cell2.dependencies.clone();\r\n                *get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,row as i32,col as i32) = new_cell.clone();\r\n                sheet_functions::recalculate_dependecy(CellInfo { row: row as i16, col: col as i16 }, \u0026mut app.sheets[app.current_sheet_index].sheet);\r\n                app.redo_stack.clear();\r\n                app.undo_stack.push(Action::Inserted {\r\n                    sheet_index: app.current_sheet_index,\r\n                    row: row as i16,\r\n                    col: col as i16,\r\n                    previous_cell: old_cell2.clone(),\r\n                });\r\n            }\r\n            app.cut_copied_cell = None;\r\n            app.status = \"Pasted\".to_string();\r\n        } else {\r\n            app.status = \"Nothing to paste\".to_string();\r\n        }\r\n    } else {\r\n        app.status = \"No cell selected\".to_string();\r\n    }\r\n}\r\n\r\npub fn show_menu(mut app: \u0026mut SpreadsheetApp, ctx: \u0026egui::Context, ui: \u0026mut egui::Ui) -\u003e egui::CollapsingResponse\u003c()\u003e {\r\n    egui::CollapsingHeader::new(\"Menu\")\r\n        .default_open(true)\r\n        .show(ui, |ui| {\r\n            ui.horizontal(|ui| {\r\n                if app.show_menu == Menu::None \u0026\u0026 ui.button(\"Save\").clicked() {\r\n                    app.show_menu = Menu::Save;\r\n                }\r\n                if app.show_menu == Menu::Save {\r\n                    egui::Window::new(\"Save\").resizable(false).collapsible(false).movable(false).show(ctx, |ui| {\r\n                        ui.label(\"Enter filename:\");\r\n                        let resp = ui.text_edit_singleline(\u0026mut app.save_filename);\r\n                        if resp.lost_focus() {\r\n                            app.show_menu = Menu::None;\r\n                        }\r\n                        ui.horizontal(|ui| {\r\n                            if ui.button(\"Save File\").clicked() || ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                if app.save_filename.is_empty() {\r\n                                    app.status = \"Please enter a filename\".to_string();\r\n                                } else {\r\n                                    let save_file_name = format!(\"{}.290\", app.save_filename);\r\n                                    save_all_sheets(\u0026app.sheets, \u0026save_file_name);\r\n                                    app.status = \"Saved\".to_string();\r\n                                    app.show_menu = Menu::None;\r\n                                }\r\n                            }\r\n                            if ui.button(\"Save to CSV\").clicked() || ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                if app.save_filename.is_empty() {\r\n                                    app.status = \"Please enter a filename\".to_string();\r\n                                } else {\r\n                                    convert_to_csv(\u0026app.sheets[app.current_sheet_index].sheet, \u0026app.save_filename);\r\n                                    app.status = \"Saved\".to_string();\r\n                                    app.show_menu = Menu::None;\r\n                                }\r\n                            }\r\n                            if ui.button(\"Cancel\").clicked() {\r\n                                app.show_menu = Menu::None;\r\n                            }\r\n                        });\r\n                    });\r\n                }\r\n                \r\n                if app.show_menu == Menu::None \u0026\u0026 ui.button(\"Open\").clicked() {\r\n                    app.show_menu = Menu::Open;\r\n                }\r\n               \r\n                if app.show_menu == Menu::Open {\r\n                    egui::Window::new(\"Open\").resizable(false).collapsible(false).movable(false).show(ctx, |ui| {\r\n                        ui.label(\"Enter filename:\");    \r\n                        let resp = ui.text_edit_singleline(\u0026mut app.open_filename);\r\n                        if resp.lost_focus() {\r\n                            app.show_menu = Menu::None;\r\n                        }\r\n                        ui.horizontal(|ui| {\r\n                            if ui.button(\"Open\").clicked() || ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                if app.open_filename.is_empty() {\r\n                                    app.status = \"Please enter a filename\".to_string();\r\n                                } else if app.open_filename.ends_with(\".csv\") {\r\n                                    app.show_menu = Menu::None;\r\n                                    let name = app.open_filename.clone();\r\n                                    app.status = open_csv(\u0026name, \u0026mut app);\r\n                                } else if app.open_filename.ends_with(\".290\") {\r\n                                    app.show_menu = Menu::None;\r\n                                    app.sheets = load_all_sheets(\u0026app.open_filename);\r\n                                    app.current_sheet_index = 0;\r\n                                    app.status = \"Loaded\".to_string();\r\n                                } else {\r\n                                    app.status = \"Please enter a valid filename\".to_string();\r\n                                }\r\n                            }\r\n                            if ui.button(\"Cancel\").clicked() {\r\n                                app.show_menu = Menu::None;\r\n                            }\r\n                        });\r\n                    });\r\n                }\r\n\r\n                if app.show_menu == Menu::None \u0026\u0026 ui.button(\"Find and Replace\").clicked() {\r\n                    app.show_menu = Menu::FindAndReplace;\r\n                }\r\n                if app.show_menu == Menu::FindAndReplace {\r\n                    egui::Window::new(\"Find and Replace\").resizable(false).collapsible(false).show(ctx, |ui| {\r\n                        ui.label(\"Find:\");\r\n                        ui.text_edit_singleline(\u0026mut app.find_text);\r\n                        ui.label(\"Replace with:\");\r\n                        ui.text_edit_singleline(\u0026mut app.replace_text);\r\n                        ui.horizontal(|ui| {\r\n                            if ui.button(\"Replace All\").clicked() || ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                if app.find_text.is_empty() {\r\n                                    app.status = \"Please enter text to find\".to_string();\r\n                                } else {\r\n                                    app.find_and_replace();\r\n                                    app.show_menu = Menu::None;\r\n                                }\r\n                            }\r\n                            if ui.button(\"Cancel\").clicked() {\r\n                                app.show_menu = Menu::None;\r\n                                app.find_text.clear();\r\n                                app.replace_text.clear();\r\n                            }\r\n                        });\r\n                    });\r\n                }\r\n\r\n                if app.show_menu == Menu::None \u0026\u0026 ui.button(\"Plot Graph\").clicked() {\r\n                    app.show_menu = Menu::PlotGraph;\r\n                }\r\n                if app.show_menu == Menu::PlotGraph {\r\n                    egui::Window::new(\"Plot Graph\").resizable(false).collapsible(false).show(ctx, |ui| {\r\n                        ui.label(\"Enter first column (e.g., A):\");\r\n                        ui.text_edit_singleline(\u0026mut app.plot_column1);\r\n                        ui.label(\"Enter second column (e.g., B):\");\r\n                        ui.text_edit_singleline(\u0026mut app.plot_column2);\r\n                        ui.label(\"Enter start row (e.g., 1):\");\r\n                        ui.text_edit_singleline(\u0026mut app.plot_row_start);\r\n                        ui.label(\"Enter end row (e.g., 5):\");\r\n                        ui.text_edit_singleline(\u0026mut app.plot_row_end);\r\n                        ui.horizontal(|ui| {\r\n                            if ui.button(\"Plot\").clicked() || ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                // Validate inputs\r\n                                let col1 = sheet_functions::col_name_to_col_num(\u0026app.plot_column1);\r\n                                let col2 = sheet_functions::col_name_to_col_num(\u0026app.plot_column2);\r\n                                let row_start = app.plot_row_start.parse::\u003ci32\u003e().ok().map(|r| r - 1);\r\n                                let row_end = app.plot_row_end.parse::\u003ci32\u003e().ok().map(|r| r - 1);\r\n                                let sheet = \u0026app.sheets[app.current_sheet_index].sheet;\r\n\r\n                                if col1 \u003e= 0 \u0026\u0026 col2 \u003e= 0 \u0026\u0026 col1 \u003c sheet.cols \u0026\u0026 col2 \u003c sheet.cols \u0026\u0026 \r\n                                   row_start.is_some() \u0026\u0026 row_end.is_some() \u0026\u0026 \r\n                                   row_start.unwrap() \u003e= 0 \u0026\u0026 row_end.unwrap() \u003c sheet.rows \u0026\u0026 \r\n                                   row_start.unwrap() \u003c= row_end.unwrap() {\r\n                                    app.show_plot = true;\r\n                                    app.show_menu = Menu::None;\r\n                                    app.status = \"Plotting graph\".to_string();\r\n                                } else {\r\n                                    app.status = \"Invalid column or row range\".to_string();\r\n                                }\r\n                            }\r\n                            if ui.button(\"Cancel\").clicked() {\r\n                                app.show_menu = Menu::None;\r\n                                app.plot_column1.clear();\r\n                                app.plot_column2.clear();\r\n                                app.plot_row_start.clear();\r\n                                app.plot_row_end.clear();\r\n                            }\r\n                        });\r\n                    });\r\n                }\r\n\r\n                if app.show_plot {\r\n                    egui::Window::new(\"Graph\").resizable(true).show(ctx, |ui| {\r\n                        let col1 = sheet_functions::col_name_to_col_num(\u0026app.plot_column1) as usize;\r\n                        let col2 = sheet_functions::col_name_to_col_num(\u0026app.plot_column2) as usize;\r\n                        let row_start = app.plot_row_start.parse::\u003cusize\u003e().unwrap() - 1;\r\n                        let row_end = app.plot_row_end.parse::\u003cusize\u003e().unwrap() - 1;\r\n                        let sheet = \u0026mut app.sheets[app.current_sheet_index].sheet;\r\n\r\n                        // Collect plot points\r\n                        let mut points: Vec\u003c[f64; 2]\u003e = Vec::new();\r\n                        for row in row_start..=row_end {\r\n                            let x = if  get_or_create_cell(sheet,row as i32,col1 as i32).is_error {\r\n                                0.0\r\n                            } else {\r\n                                get_or_create_cell(sheet,row as i32,col1 as i32).value as f64\r\n                            };\r\n                            let y = if get_or_create_cell(sheet,row as i32,col2 as i32).is_error {\r\n                                0.0\r\n                            } else {\r\n                                get_or_create_cell(sheet,row as i32,col2 as i32).value as f64\r\n                            };\r\n                            points.push([x, y]);\r\n                        }\r\n\r\n                        let plot_points = PlotPoints::from(points);\r\n                        let line = Line::new(plot_points).color(app.theme.text_color);\r\n                        Plot::new(\"Spreadsheet Plot\")\r\n                            .view_aspect(2.0)\r\n                            .show(ui, |plot_ui| plot_ui.line(line));\r\n                        \r\n                        if ui.button(\"Close\").clicked() {\r\n                            app.show_plot = false;\r\n                            app.plot_column1.clear();\r\n                            app.plot_column2.clear();\r\n                            app.plot_row_start.clear();\r\n                            app.plot_row_end.clear();\r\n                        }\r\n                    });\r\n                }\r\n\r\n                if ui.button(\"Clear\").clicked() { \r\n                    app.sheets[app.current_sheet_index].sheet.data.clear();\r\n                    app.sheets[app.current_sheet_index].sheet.buul.clear();\r\n                    app.sheets[app.current_sheet_index].sheet.tuup.clear();\r\n                    app.redo_stack.clear();\r\n                    app.undo_stack.clear();\r\n                    app.status = \"Cleared\".to_string();\r\n                }\r\n\r\n                if ui.button(\"Cut\").clicked() {\r\n                    cut(app);\r\n                }\r\n\r\n                if ui.button(\"Copy\").clicked() {\r\n                    copy(app);\r\n                }\r\n\r\n                if ui.button(\"Paste\").clicked() {\r\n                    paste(app);\r\n                }\r\n\r\n                if ui.button(\"Undo\").clicked() {\r\n                    app.undo();\r\n                    ctx.request_repaint();\r\n                }\r\n\r\n                if ui.button(\"Redo\").clicked() {\r\n                    app.redo();\r\n                    ctx.request_repaint();\r\n                }\r\n                if ui.button(\"Font\").clicked() {\r\n                    app.show_menu = Menu::Font;\r\n                }\r\n                if app.show_menu == Menu::Font {\r\n                    egui::Window::new(\"Font Selection\").resizable(false).collapsible(false).show(ctx, |ui| {\r\n                        ui.label(\"Select font:\");\r\n                        for (index, font) in FONTS.iter().enumerate() {\r\n                            if ui.button(font.name).clicked() {\r\n                                if app.current_font_index != index {\r\n                                    app.current_font_index = index;\r\n                                    crate::ui::fonts::setup_custom_fonts(ctx, \u0026FONTS[index]);\r\n                                }\r\n                                app.show_menu = Menu::None;\r\n                            }\r\n                        }\r\n                    });\r\n                }\r\n                if ui.button(\"Theme\").clicked() {\r\n                    app.show_menu = Menu::Theme;\r\n                }\r\n                if ui.button(\"Scroll to\").clicked() {\r\n                    app.show_menu = Menu::SelectCell;\r\n                }\r\n                if app.show_menu == Menu::SelectCell {\r\n                    egui::Window::new(\"select_cell\").resizable(false).collapsible(false).show(ctx, |ui| {\r\n                        ui.label(\"Enter cell to scroll to:\");\r\n                        let select_cell = ui.text_edit_singleline(\u0026mut app.input_select_cell);\r\n                        ui.horizontal(|ui|{\r\n                        if ui.input(|i| i.key_pressed(egui::Key::Enter)) || ui.button(\"Scroll\").clicked() {\r\n                            let re = regex::Regex::new(r\"^([A-Z]+)(\\d+)$\").unwrap();\r\n                            if let Some(caps) = re.captures(\u0026app.input_select_cell) {\r\n                                let col_name = caps.get(1).unwrap().as_str();\r\n                                let row_str = caps.get(2).unwrap().as_str();\r\n                                if let Ok(row) = row_str.parse::\u003ci32\u003e() {\r\n                                    let col = col_name_to_col_num(col_name);\r\n                                    let row = row - 1;\r\n                                    if sheet_functions::is_valid_cell(row, col, app.sheets[app.current_sheet_index].sheet.rows, app.sheets[app.current_sheet_index].sheet.cols) {\r\n                                        app.selected_cell = Some((row as usize, col as usize));\r\n                                        app.row_start = row as i32;\r\n                                        app.col_start = col as i32;\r\n                                        app.show_menu = Menu::None;\r\n                                        app.status = String::from(\"Ok\");\r\n                                    } else {\r\n                                        app.status = String::from(\"Invalid cell\");\r\n                                    }\r\n                                } else {\r\n                                    app.status = String::from(\"Invalid cell\");\r\n                                }\r\n                            } else {\r\n                                app.status = String::from(\"Invalid cell\");\r\n                            }\r\n                        }\r\n                        if ui.button(\"Cancel\").clicked() {\r\n                            app.show_menu = Menu::None;\r\n                            app.status = String::from(\"Ok\");\r\n                        }});\r\n                        \r\n                    });\r\n                }        \r\n\r\n                if app.show_menu == Menu::Theme {\r\n                    egui::Window::new(\"Theme\").resizable(false).collapsible(false).show(ctx, |ui| {\r\n                        ui.label(\"Select theme:\");\r\n                        for theme in \u0026THEMES {\r\n                            if ui.button(theme.name).clicked() {\r\n                                app.theme = theme.clone();\r\n                                app.show_menu = Menu::None;\r\n                            }\r\n                        }\r\n                    });\r\n                }\r\n                if ui.button(\"Sort\").clicked(){\r\n                    app.show_menu=Menu :: Sort;\r\n                }\r\n                if app.show_menu == Menu :: Sort {\r\n                    egui::Window::new(\"Sort\").resizable(false).collapsible(false).show(ctx, |ui| {\r\n                        ui.label(\"Select column to sort:\");\r\n                        ui.horizontal(|ui| {\r\n                            ui.label(\"Enter Range Start:\");\r\n                            ui.text_edit_singleline(\u0026mut app.sort_range_start);\r\n                            ui.label(\"Enter Range End:\");\r\n                            ui.text_edit_singleline(\u0026mut app.sort_range_end);\r\n                            ui.label(\"Sort by Column/Row:\");\r\n                            ui.text_edit_singleline(\u0026mut app.sort_col_row);\r\n                        });\r\n                        ui.horizontal(|ui| {                           \r\n                            if ui.button(\"Sort Ascending\").clicked() || ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                    sort_button_parser(app,true);\r\n                                    app.show_menu = Menu::None;\r\n                            }\r\n                            if ui.button(\"Sort Descending\").clicked() {\r\n                                    sort_button_parser(app,false);\r\n                                    app.show_menu = Menu::None;\r\n                            }\r\n                        });\r\n                        if ui.button(\"Cancel\").clicked() {\r\n                            app.show_menu = Menu::None;\r\n                        }\r\n                    });\r\n                }\r\n            });\r\n        })\r\n}","traces":[],"covered":0,"coverable":0},{"path":["/","mnt","c","Users","deepa","Desktop","290keChode","COP290JUNG","src","ui","mod.rs"],"content":"pub mod menu;\r\npub mod sheet_display;\r\npub mod themes;\r\npub mod app_impl;\r\npub mod utils;\r\npub mod fonts;","traces":[],"covered":0,"coverable":0},{"path":["/","mnt","c","Users","deepa","Desktop","290keChode","COP290JUNG","src","ui","sheet_display.rs"],"content":"use crate::ui::app_impl::{Mode,Action,SpreadsheetApp}; \r\nuse crate::sheet_functions::{col_num_to_col_name,get_or_create_cell};\r\nuse crate::parser;\r\nuse egui:: Id;\r\n \r\npub fn show_spreadsheet(app: \u0026mut SpreadsheetApp, ctx: \u0026egui::Context,visible_rows: \u0026i32,visible_cols: \u0026i32)-\u003eegui::InnerResponse\u003c()\u003e{\r\n    egui::CentralPanel::default().show(ctx, |ui| {\r\n        let cell_size = egui::vec2(120.0, 30.0);\r\n        \r\n        let scroll_delta = ui.input(|i| i.smooth_scroll_delta);\r\n        if scroll_delta.y != 0.0 {\r\n            let scroll_rows = (scroll_delta.y / 30.0).round() as i32;\r\n            app.row_start = (app.row_start - scroll_rows).max(0).min(app.sheets[app.current_sheet_index].sheet.rows - 1);\r\n        }\r\n        if scroll_delta.x != 0.0 {\r\n            let scroll_cols = (scroll_delta.x / 30.0).round() as i32;\r\n            app.col_start = (app.col_start - scroll_cols).max(0).min(app.sheets[app.current_sheet_index].sheet.cols - 1);\r\n        }\r\n        \r\n        egui::Grid::new(\"header_grid\")\r\n            .min_col_width(cell_size.x)\r\n            .min_row_height(cell_size.y)\r\n            .spacing([0.0, 0.0])\r\n            .show(ui, |ui| {\r\n                let corner_rect = ui.available_rect_before_wrap();\r\n                ui.painter().rect_filled(\r\n                    corner_rect,\r\n                    0.0,\r\n                    app.theme.header_bg\r\n                );\r\n                ui.painter().rect_stroke(\r\n                    corner_rect,\r\n                    0.0,\r\n                    egui::Stroke::new(1.0, app.theme.grid_line_color)\r\n                );\r\n                ui.add_sized(\r\n                    cell_size,\r\n                    egui::Label::new(\r\n                        egui::RichText::new(\"\")\r\n                            .color(app.theme.header_text_color)\r\n                            .text_style(egui::TextStyle::Heading)\r\n                    )\r\n                );\r\n                \r\n                for c in app.col_start..(app.col_start + visible_cols).min(app.sheets[app.current_sheet_index].sheet.cols) {\r\n                    let header_rect = ui.available_rect_before_wrap();\r\n                    ui.painter().rect_filled(\r\n                        header_rect,\r\n                        0.0,\r\n                        app.theme.header_bg\r\n                    );\r\n                    ui.painter().rect_stroke(\r\n                        header_rect,\r\n                        0.0,\r\n                        egui::Stroke::new(1.0, app.theme.grid_line_color)\r\n                    );\r\n                    \r\n                    ui.with_layout(egui::Layout::centered_and_justified(egui::Direction::LeftToRight), |ui| {\r\n                        ui.add_sized(\r\n                            cell_size,\r\n                            egui::Label::new(\r\n                                egui::RichText::new(col_num_to_col_name(c))\r\n                                    .strong()\r\n                                    .color(app.theme.header_text_color)\r\n                                    .text_style(egui::TextStyle::Heading)\r\n                            )\r\n                        );\r\n                    });\r\n                }\r\n                ui.end_row();\r\n            });\r\n        \r\n        egui::ScrollArea::vertical()\r\n            .auto_shrink([false, false])\r\n            .show(ui, |ui| {\r\n                egui::Grid::new(\"sheet_grid\")\r\n                    .min_col_width(cell_size.x)\r\n                    .min_row_height(cell_size.y)\r\n                    .spacing([0.0, 0.0])\r\n                    .show(ui, |ui| {\r\n                        for r in app.row_start..(app.row_start + visible_rows).min(app.sheets[app.current_sheet_index].sheet.rows) {\r\n                            let row_header_rect = ui.available_rect_before_wrap();\r\n                            ui.painter().rect_filled(\r\n                                row_header_rect,\r\n                                0.0,\r\n                                app.theme.header_bg\r\n                            );\r\n                            ui.painter().rect_stroke(\r\n                                row_header_rect,\r\n                                0.0,\r\n                                egui::Stroke::new(1.0, app.theme.grid_line_color)\r\n                            );\r\n                            \r\n                            ui.with_layout(egui::Layout::centered_and_justified(egui::Direction::LeftToRight), |ui| {\r\n                                ui.add_sized(\r\n                                    cell_size,\r\n                                    egui::Label::new(\r\n                                        egui::RichText::new((r + 1).to_string())\r\n                                            .strong()\r\n                                            .color(app.theme.header_text_color)\r\n                                            .text_style(egui::TextStyle::Heading)\r\n                                    )\r\n                                );\r\n                            });\r\n                            \r\n                            for c in app.col_start..(app.col_start + visible_cols).min(app.sheets[app.current_sheet_index].sheet.cols) {\r\n                                let cell = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,r as i32,c as i32);\r\n                                let display = if cell.string.is_some() {\r\n                                    cell.string.as_ref().unwrap().clone()\r\n                                } else if cell.is_error {\r\n                                    \"Err\".to_string()\r\n                                } else {\r\n                                    cell.value.to_string()\r\n                                };\r\n                                \r\n                                let is_cut = app.cut_copied_cell == Some((r as i16,c as i16));\r\n                                let is_sel = app.selected_cell == Some((r as usize, c as usize));\r\n                                \r\n                                let rect = ui.available_rect_before_wrap();\r\n                                \r\n                                ui.painter().rect_filled(\r\n                                    rect,\r\n                                    0.0,\r\n                                    if is_sel || is_cut { app.theme.selected_cell_bg } else { app.theme.cell_bg }\r\n                                );\r\n                                \r\n                                ui.painter().rect_stroke(\r\n                                    rect,\r\n                                    0.0,\r\n                                    egui::Stroke::new(1.0, app.theme.grid_line_color)\r\n                                );\r\n                                \r\n                                if is_sel \u0026\u0026 app.mode == Mode::Insert {\r\n                                    if !app.is_editing {\r\n                                        app.editing_value = display.clone();\r\n                                        app.is_editing = true;\r\n                                    }\r\n                                    \r\n                                    let id = Id::new(\"cell_edit\");\r\n                                    if app.is_editing {\r\n                                        ui.memory_mut(|mem| mem.request_focus(id));\r\n                                    }\r\n                                    \r\n                                    let edit = ui.add_sized(\r\n                                        cell_size,\r\n                                        egui::TextEdit::singleline(\u0026mut app.editing_value)\r\n                                            .id(id)\r\n                                            .frame(false)\r\n                                            .desired_width(cell_size.x)\r\n                                            .text_color(app.theme.text_color)\r\n                                            .cursor_at_end(true)\r\n                                    );\r\n                                    \r\n                                    if edit.lost_focus() \u0026\u0026 ui.input(|i| i.key_pressed(egui::Key::Enter)) {\r\n                                        app.clear_clipboard();\r\n                                        let col_name = col_num_to_col_name(c);\r\n                                        let row_str = (r + 1).to_string();\r\n                                        let cmd = format!(\"{}{}={}\", col_name, row_str, app.editing_value);\r\n                                        let old_cell = get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,r as i32,c as i32).clone();\r\n                                        let sheet_rows = app.sheets[app.current_sheet_index].sheet.rows;\r\n                                        let sheet_cols = app.sheets[app.current_sheet_index].sheet.cols;\r\n                                        parser::parse_command(\r\n                                            \u0026cmd,\r\n                                            \u0026mut app.row_start,\r\n                                            \u0026mut app.col_start,\r\n                                            \u0026mut app.time,\r\n                                            \u0026mut app.status,\r\n                                            \u0026sheet_rows,\r\n                                            \u0026sheet_cols,\r\n                                            \u0026mut app.sheets[app.current_sheet_index].sheet,\r\n                                            \u0026mut true,\r\n                                        );\r\n                                         \r\n                                        app.undo_stack.push(Action::Inserted {\r\n                                            sheet_index: app.current_sheet_index,\r\n                                            row: r as i16,\r\n                                            col: c as i16,\r\n                                            previous_cell: old_cell,\r\n                                        });\r\n                                        app.redo_stack.clear();\r\n                                        app.is_editing = false;\r\n                                        app.editing_value.clear();\r\n                                    }\r\n                                    \r\n                                    if ui.input(|i| i.key_pressed(egui::Key::Escape)) {\r\n                                        app.mode = Mode::Normal;\r\n                                        app.is_editing = false;\r\n                                        app.selected_cell = None;\r\n                                        app.editing_value.clear();\r\n                                    }\r\n                                    \r\n                                    if ui.input(|i| i.pointer.any_click()) {\r\n                                        let pointer_pos = ui.input(|i| i.pointer.interact_pos());\r\n                                        if let Some(pos) = pointer_pos {\r\n                                            if !rect.contains(pos) { \r\n                                                app.is_editing = false;\r\n                                                app.editing_value.clear();\r\n                                            }\r\n                                        }\r\n                                    }\r\n                                } else {\r\n                                    let response = ui.add_sized(\r\n                                        cell_size,\r\n                                        egui::Label::new(\r\n                                            egui::RichText::new(display)\r\n                                            .color(app.theme.text_color)\r\n                                        ).sense(egui::Sense::click()),\r\n                                    );\r\n                                    \r\n                                    if response.clicked() {\r\n                                        if app.is_editing {\r\n                                            app.is_editing = false;\r\n                                            app.editing_value.clear();\r\n                                        }\r\n                                        \r\n                                        app.selected_cell = Some((r as usize, c as usize));\r\n                                        \r\n                                        if response.clicked_by(egui::PointerButton::Primary) \u0026\u0026 \r\n                                           response.double_clicked() {\r\n                                            app.mode = Mode::Insert;\r\n                                        }\r\n                                    }\r\n                                }\r\n                            }\r\n                            ui.end_row();\r\n                        }\r\n                    });\r\n            });\r\n        \r\n        ui.horizontal(|ui| {\r\n            if ui.button(\"◀\").clicked() {\r\n                app.col_start = (app.col_start - 1).max(0);\r\n            }\r\n            \r\n            let progress = app.col_start as f32 / (app.sheets[app.current_sheet_index].sheet.cols - visible_cols).max(1) as f32;\r\n            let mut progress_bar = progress;\r\n            if ui.add(egui::Slider::new(\u0026mut progress_bar, 0.0..=1.0).text(\"Scroll\")).changed() {\r\n                app.col_start = ((app.sheets[app.current_sheet_index].sheet.cols - visible_cols).max(1) as f32 * progress_bar) as i32;\r\n                app.col_start = app.col_start.max(0).min(app.sheets[app.current_sheet_index].sheet.cols - 1);\r\n            }\r\n            \r\n            if ui.button(\"▶\").clicked() {\r\n                app.col_start = (app.col_start + 1).min((app.sheets[app.current_sheet_index].sheet.cols - visible_cols).max(0));\r\n            }\r\n        });\r\n    })\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["/","mnt","c","Users","deepa","Desktop","290keChode","COP290JUNG","src","ui","themes.rs"],"content":"use eframe::epaint::Color32;\r\n\r\n#[derive(Clone)]\r\npub struct Theme {\r\n    pub name: \u0026'static str,\r\n    pub is_light_theme: bool,\r\n    pub cell_bg: Color32,\r\n    pub selected_cell_bg: Color32,\r\n    pub header_bg: Color32,\r\n    pub grid_line_color: Color32,\r\n    pub text_color: Color32,\r\n    pub header_text_color: Color32,\r\n}\r\n\r\n\r\npub const THEMES: [Theme; 6] = [\r\n    Theme {\r\n        name: \"Dark\",\r\n        is_light_theme: false,\r\n        cell_bg: Color32::from_rgb(30, 34, 42),\r\n        selected_cell_bg: Color32::from_rgb(60, 70, 90),\r\n        header_bg: Color32::from_rgb(45, 49, 58),\r\n        grid_line_color: Color32::from_rgb(60, 64, 72),\r\n        text_color: Color32::from_rgb(220, 220, 220),\r\n        header_text_color: Color32::from_rgb(255, 255, 255),\r\n    },\r\n    Theme {\r\n        name: \"Light\",\r\n        is_light_theme: true,\r\n        cell_bg: Color32::from_rgb(240, 240, 240),\r\n        selected_cell_bg: Color32::from_rgb(200, 200, 200),\r\n        header_bg: Color32::from_rgb(220, 220, 220),\r\n        grid_line_color: Color32::from_rgb(200, 200, 200),\r\n        text_color: Color32::from_rgb(0, 0, 0),\r\n        header_text_color: Color32::from_rgb(0, 0, 0),\r\n    },\r\n    Theme {\r\n        name: \"zindagi do pal ki\",\r\n        is_light_theme: false,\r\n        cell_bg: Color32::from_rgb(0, 43, 54),\r\n        selected_cell_bg: Color32::from_rgb(7, 54, 66),\r\n        header_bg: Color32::from_rgb(88, 110, 117),\r\n        grid_line_color: Color32::from_rgb(101, 123, 131),\r\n        text_color: Co
