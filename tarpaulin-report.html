2, col2: i32, row2: i32, app: \u0026mut SpreadsheetApp, add_to_redo: bool) {\r\n    let mut changes = Vec::new();\r\n    for i in row1..(row2+1){\r\n        let mut temp = Vec :: new();\r\n        for j in col1..(col2+1){\r\n            temp.push(get_or_create_cell(\u0026mut app.sheets[sheet_index].sheet,i as i32,j as i32).clone());\r\n        }\r\n        changes.push(temp);\r\n    }\r\n    if !add_to_redo{\r\n        app.undo_stack.push(Action::Sort{sheet_index,changes,row1,col1,row2,col2});\r\n    }\r\n    else{\r\n        app.redo_stack.push(Action::Sort{sheet_index,changes,row1,col1,row2,col2});\r\n    }\r\n}\r\n\r\npub fn sort_extension(col1: i32, row1: i32, col2: i32, row2: i32, sort_key: \u0026str, is_column: bool, sort_order: \u0026str, app: \u0026mut SpreadsheetApp) {\r\n    if (col2\u003ccol1) || (row2\u003crow1){\r\n        app.status = String::from(\"wrong range\");\r\n        app.time = 0.0;\r\n        return;\r\n    }\r\n    if is_column {\r\n        let sort_col = sheet_functions::col_name_to_col_num(sort_key);\r\n        if sort_col \u003e col2 || sort_col \u003c col1 {\r\n            app.status = String::from(\"sorted column out of range\");\r\n            app.time = 0.0;\r\n            return;\r\n        }\r\n        for i in row1..=row2 + 1{\r\n            if get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,i as i32,sort_col as i32).string.is_some(){\r\n                app.status = String::from(\"sorted column has string\");\r\n                app.time = 0.0;\r\n                return;\r\n            }\r\n        }\r\n    }\r\n    else{\r\n        let sort_row = sort_key.parse::\u003ci32\u003e().unwrap() - 1;\r\n        if sort_row \u003e row2 || sort_row \u003c row1{\r\n            app.status = String::from(\"sorted row out of range\");\r\n            app.time = 0.0;\r\n            return;\r\n        }\r\n        for i in col1..=col2 + 1{\r\n            if get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,sort_row as i32,i as i32).string.is_some(){\r\n                app.status = String::from(\"sorted row has string\");\r\n                app.time = 0.0;\r\n                return;\r\n            }\r\n        }\r\n    }\r\n    for i in row1..=row2 + 1{\r\n        for j in col1..=col2 + 1{\r\n            if get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,i as i32,j as i32).op_code != OpCode::NoConstraint \u0026\u0026 get_or_create_cell(\u0026mut app.sheets[app.current_sheet_index].sheet,i as i32,j as i32).op_code != OpCode::String {\r\n                app.status = String::from(\"range has constraints\");\r\n                app.time = 0.0;\r\n                return;\r\n            }\r\n        }\r\n    }\r\n    sort_add_to_stack(app.current_sheet_index, col1, row1, col2, row2, app, false);\r\n    sheet_functions::sort_sheet(\u0026mut app.sheets[app.current_sheet_index].sheet, col1, row1, col2, row2, sort_key, is_column, sort_order);\r\n}\r\n\r\npub fn sort_button_parser(app: \u0026mut SpreadsheetApp,sort_asc : bool) {\r\n    let re_cell = Regex::new(r\"^([A-Z]+)(\\d+)$\").unwrap();\r\n    if app.sort_col_row.is_empty() || app.sort_range_start.is_empty() || app.sort_range_end.is_empty() {\r\n        app.status = \"Please enter required data\".to_string();\r\n    } else {\r\n        let col1;\r\n        let row1;\r\n        let col2;\r\n        let row2;\r\n        println!(\"here\");\r\n        if let Some(caps) = re_cell.captures(\u0026app.sort_range_start.to_string()){\r\n            let col_in = caps.get(1).unwrap().as_str();\r\n            let row_in = caps.get(2).unwrap().as_str();\r\n            println!(\"{col_in}\");\r\n            col1 = sheet_functions::col_name_to_col_num(col_in);\r\n            println!(\"here\");\r\n            row1 = row_in.parse::\u003ci32\u003e().unwrap();\r\n            println!(\"here\");\r\n        }\r\n        else{\r\n            app.status = \"Invalid range start\".to_string();\r\n            return;\r\n umber of columns:\"); \r\n                        let _cols = ui.text_edit_singleline(\u0026mut self.new_sheet_cols);\r\n                        ui.label(\"Enter sheet name:\");\r\n                        let _name = ui.text_edit_singleline(\u0026mut self.new_sheet_name); \r\n                        ui.horizontal(|ui| {\r\n                            if ui.button(\"Create\").clicked() {\r\n                                if self.new_sheet_rows.is_empty() || self.new_sheet_cols.is_empty() {\r\n                                    self.status = String::from(\"Please enter number of rows and columns\");\r\n                                } else {\r\n                                    match (self.new_sheet_rows.parse::\u003ci32\u003e(), self.new_sheet_cols.parse::\u003ci32\u003e()) {\r\n                                        (Ok(rows), Ok(cols)) =\u003e {\r\n                                            if rows \u003c= 0 || cols \u003c= 0 || rows \u003e 1000 || cols \u003e 18278 {\r\n                                                self.status = String::from(\"number of rows and columns not in valid range\");\r\n                                            } else {\r\n                                                if self.new_sheet_name.is_empty() {\r\n                                                    self.new_sheet_name = format!(\"Sheet {}\", self.sheets.len() + 1);\r\n                                                }\r\n                                                self.create_new_sheet(rows, cols);\r\n                                            }\r\n                                        },\r\n                                        _ =\u003e {\r\n                                            self.status = String::from(\"Please enter valid integers for rows and columns\");\r\n                                        }\r\n                                    }\r\n                                }\r\n                            }\r\n                            if ui.bu unds to avoid negative ranges\r\n                let visible_rows = visible_rows.min(sheet.rows);\r\n                let visible_cols = visible_cols.min(sheet.cols);\r\n        \r\n                // Adjust scroll position to keep selected cell in view\r\n                if (r as i32) \u003c self.row_start {\r\n                    self.row_start = r as i32;\r\n                } else if (r as i32) \u003e= self.row_start + visible_rows {\r\n                    self.row_start = (r as i32) - visible_rows + 1;\r\n                }\r\n        \r\n                if (c as i32) \u003c self.col_start {\r\n                    self.col_start = c as i32;\r\n                } else if (c as i32) \u003e= self.col_start + visible_cols {\r\n                    self.col_start = (c as i32) - visible_cols + 1;\r\n                }\r\n        \r\n                // Don't allow scrolling beyond bounds (with saturating_sub)\r\n                let max_row_start = sheet.rows.saturating_sub(visible_rows);\r\n                let max_col_start = sheet.cols.saturating_sub(visible_cols);\r\n        \r\n                self.row_start = self.row_start.clamp(0, max_row_start);\r\n                self.col_start = self.col_start.clamp(0, max_col_start);\r\n            }\r\n        }\r\n\r\n        if self.mode == Mode::Normal {\r\n            if input.key_pressed(egui::Key::H) {self.col_start = (self.col_start - 1).max(0);}\r\n            if input.key_pressed(egui::Key::L) {self.col_start = (self.col_start + 1).min(self.sheets[self.current_sheet_index].sheet.cols - 1);}\r\n            if input.key_pressed(egui::Key::K) {self.row_start = (self.row_start - 1).max(0);}\r\n            if input.key_pressed(egui::Key::J) {self.row_start = (self.row_start + 1).min(self.sheets[self.current_sheet_index].sheet.rows - 1);}\r\n        }\r\n\r\n        if let Some(cmd) = entered {\r\n            let sheet_rows = self.sheets[self.current_sheet_index].sheet.rows;\r\n            let sheet_cols = self.sheets[self.cur l_row2 {\r\n        for j in c1..=c2 {\r\n            let value = sheet.data.get(\u0026(i as i16, j as i16)).map_or(0, |cell| cell.value); // Use 0 if the cell is not in the map\r\n            a += value;\r\n        }\r\n    }\r\n    a\r\n}\r\n\r\npub fn min(sheet: \u0026Sheet, val_row1: i16, c1: i16, val_row2: i16, c2: i16) -\u003e i32 {\r\n    let mut a = i32::MAX;\r\n    for i in val_row1..=val_row2 {\r\n        for j in c1..=c2 {\r\n            let value = sheet.data.get(\u0026(i as i16, j as i16)).map_or(0, |cell| cell.value); // Use 0 if the cell is not in the map\r\n            if value \u003c a {a = value;}\r\n        }\r\n    }\r\n    a\r\n}\r\n\r\npub fn max(sheet: \u0026Sheet, val_row1: i16, c1: i16, val_row2: i16, c2: i16) -\u003e i32 {\r\n    let mut a = i32::MIN;\r\n    for i in val_row1..=val_row2 {\r\n        for j in c1..=c2 {\r\n            let value = sheet\r\n                .data\r\n                .get(\u0026(i as i16, j as i16))\r\n                .map_or(0, |cell| cell.value); // Use 0 if the cell is not in the map\r\n            if value \u003e a { a = value;}\r\n        }\r\n    }\r\n    a\r\n}\r\n\r\npub fn avg(sheet: \u0026Sheet, val_row1: i16, c1: i16, val_row2: i16, c2: i16) -\u003e i32 {\r\n    let total = sum(sheet, val_row1, c1, val_row2, c2);\r\n    let row2 = val_row2 as i32;\r\n    let col2 = c2 as i32;\r\n    let row1 = val_row1 as i32;\r\n    let col1 = c1 as i32;\r\n    let count = ((row2 - row1 + 1) * (col2 - col1 + 1)) as i32;\r\n    total/count\r\n}\r\npub fn stdev(sheet: \u0026Sheet, val_row1: i16, c1: i16, val_row2: i16, c2: i16) -\u003e i32 {\r\n    let avg_val = avg(sheet, val_row1, c1, val_row2, c2);\r\n    let mut total = 0;\r\n    for i in val_row1..=val_row2 {\r\n        for j in c1..=c2 {\r\n            let value = sheet.data.get(\u0026(i as i16, j as i16)).map_or(0, |cell| cell.value); // Use 0 if the cell is not in the map\r\n            let diff = value - avg_val;\r\n            total += diff * diff;\r\n        }\r\n    }\r\n    let row1 = val_row1 as i32;\r\n    let row2 = val_row2 as i32;\r\n    let col1 = c1 as i32;\r\n    let col2 = c2 as i32;\r\n    let count = ((row2 - row1 + 1) * (col2 - col1 + 1)) as i32;\r\n    let std = (total as f64 / count as f64).sqrt();\r\n    std.round() as i32\r\n}\r\n\r\npub fn compute_cell(op_code: OpCode, cell_value: i32, cell_value2: i32, status: \u0026mut String) -\u003e (i32, bool){\r\n\r\n    \r\n    match op_code {\r\n        CellPlusCell | CellPlusConstant =\u003e (cell_value + cell_value2,false),\r\n        CellMinusCell | CellMinusConstant =\u003e (cell_value - cell_value2, false),\r\n        CellTimesCell | CellTimesConstant =\u003e (cell_value * cell_value2, false),\r\n        CellDivideCell | CellDivideConstant =\u003e {\r\n            if cell_value2 == 0 {\r\n                (-1, true)\r\n            } else {\r\n                (cell_value / cell_value2,false)\r\n            }\r\n        }\r\n        ConstantDividesCell =\u003e {\r\n            if cell_value == 0 {\r\n                (-1, true)\r\n            } else {\r\n                (cell_value2 / cell_value, false)\r\n            }\r\n        }\r\n        String =\u003e (cell_value, false),\r\n        _ =\u003e {\r\n            status.push_str(\"err\");\r\n            (-1, true)\r\n        }\r\n    }\r\n}\r\n\r\npub fn compute_range_func(sheet: \u0026Sheet, op_code: OpCode, row1: i16, col1: i16, row2: i16, col2: i16, status: \u0026mut String) -\u003e i32 {\r\n    if col1 \u003e col2 || row1 \u003e row2 {\r\n        status.push_str(\"err\");return -1;\r\n    } \r\n    match op_code {\r\n        Sum =\u003e sum(sheet, row1, col1, row2, col2),\r\n        Min =\u003e min(sheet, row1, col1, row2, col2),\r\n        Max =\u003e max(sheet, row1, col1, row2, col2),\r\n        Avg =\u003e avg(sheet, row1, col1, row2, col2),\r\n        Stdev =\u003e stdev(sheet, row1, col1, row2, col2),\r\n        _ =\u003e -1\r\n    }\r\n} ","traces":[{"line":7,"address":[689552],"length":1,"stats"       \"STDEV\" =\u003e Stdev,\r\n        _ =\u003e NoConstraint\r\n    }\r\n}\r\n\r\n\r\n\r\npub fn remove_space(command: \u0026mut String) {\r\n    *command = command.chars().filter(|\u0026c| c != ' ').collect();\r\n}\r\n\r\npub fn parse_command(command:\u0026str, row_start:\u0026mut i32, col_start:\u0026mut i32, time:\u0026mut f32, status:\u0026mut String, total_rows:\u0026i32, total_cols:\u0026i32, sheet: \u0026mut Sheet,print_enabled : \u0026mut bool){\r\n    let mut command = command.trim().to_string();\r\n    let mut sleep_timer = 0;\r\n    let start_time = Instant::now();\r\n    let re_scroll_to = Regex::new(r\"^scroll_to([A-Z]+)(\\d+)$\").unwrap();\r\n    let re_cell_eq_int_op_int = Regex::new(r\"^([A-Z]+)(\\d+)=(\\d+)([+\\-*/])(\\d+)$\").unwrap();\r\n    let re_cell_eq_cell_op_cell = Regex::new(r\"^([A-Z]+)(\\d+)=([A-Z]+)(\\d+)([+\\-*/])([A-Z]+)(\\d+)$\").unwrap();\r\n    let re_cell_eq_int_op_cell = Regex::new(r\"^([A-Z]+)(\\d+)=(\\d+)([+\\-*/])([A-Z]+)(\\d+)$\").unwrap();\r\n    let re_cell_eq_cell_op_int = Regex::new(r\"^([A-Z]+)(\\d+)=([A-Z]+)(\\d+)([+\\-*/])(\\d+)$\").unwrap();\r\n    let re_cell_eq_func = Regex::new(r\"^([A-Z]+)(\\d+)=([A-Z]+)\\(([A-Z]+)(\\d+):([A-Z]+)(\\d+)\\)$\").unwrap();\r\n    let re_cell_eq_int = Regex::new(r\"^([A-Z]+)(\\d+)=(-?\\d+)$\").unwrap();\r\n    let re_cell_eq_cell = Regex::new(r\"^([A-Z]+)(\\d+)=([A-Z]+)(\\d+)$\").unwrap();\r\n    let re_sleep_int = Regex::new(r\"^([A-Z]+)(\\d+)=SLEEP\\((\\d+)\\)$\").unwrap();\r\n    let re_sleep_cell = Regex::new(r\"^([A-Z]+)(\\d+)=SLEEP\\(([A-Z]+)(\\d+)\\)$\").unwrap();\r\n    let re_string_cell = Regex::new(r#\"^([A-Z]+)(\\d+)=\"(.*)\"$\"#).unwrap();  \r\n    // let re_sort = Regex::new(r\"^SORT\\(\\s*([A-Z]+)(\\d+)\\s*:\\s*([A-Z]+)(\\d+)\\s*;\\s*([A-Z]+|\\d+)\\s*;\\s*(asc|desc)\\s*\\)$\").unwrap();\r\n    remove_space(\u0026mut command);\r\n\r\n   \r\n    if command == \"w\"      {*row_start = std::cmp::max(0, *row_start - 10);*status = String::from(\"ok\");}\r\n    else if command == \"s\" {*row_start = std::cmp::min(*row_start + 10, total_rows - 10);   *status = String::from(\"ok\");}\r\n    else if command == \"a\" {*col_start = std::cmp::max(0, *col_start - 10);*status = String::from(\"ok\");}\r\n    else if command == \"d\" {*col_start = std::cmp::min(*col_start + 10, total_cols - 10);*status = String::from(\"ok\");}\r\n    else if command == \"q\" {std::process::exit(0);}\r\n    else if command == \"enable_output\"  {*print_enabled = true;*status = String::from(\"ok\"); }\r\n    else if command == \"disable_output\" { *print_enabled = false; *status = String::from(\"ok\");}\r\n    // scroll_to\r\n    else if let Some(caps) = re_scroll_to.captures(\u0026command) {\r\n        let col_str = caps.get(1).unwrap().as_str(); // Extract column letters\r\n        let row_num: i32 = caps.get(2).unwrap().as_str().parse().unwrap(); // Extract row number\r\n\r\n        let c = col_name_to_col_num(col_str); // Convert column letters to number\r\n        let r = row_num - 1; // Convert to 0-based index\r\n        if is_valid_cell(r, c, *total_rows, *total_cols) { *col_start = c;*row_start = r;*status = String::from(\"ok\");} \r\n        else {*status = String::from(\"err\");}\r\n        return; \r\n    }\r\n    // Cell = String\r\n    else if let Some(caps) = re_string_cell.captures(\u0026command) {\r\n        *time = 0.0;\r\n        let ref_col = caps.get(1).unwrap().as_str();\r\n        let ref_row: i32 = caps.get(2).unwrap().as_str().parse().unwrap();\r\n        let value = caps.get(3).unwrap().as_str();\r\n        let col = col_name_to_col_num(ref_col);\r\n        let row = ref_row - 1; \r\n        if is_valid_cell(row, col, *total_rows, *total_cols) {\r\n            let cell_entry = get_or_create_cell(sheet, row, col);\r\n            // Update the cell's properties\r\n            cell_entry.string = Some(value.to_string());\r\n            cell_entry.value = 0;\r\n            cell_entry.is_error = false;\r\n\r\n            *status = String::from(\"ok\");\r\n            let cell = CellInfo { row: row as i16, col: col as i16 };\r\n            let cell1 = CellInfo { row: -1, col: -1 };\r\n            let cell2 = CellInfo { row: -1, col: -1 };\r\n            sheet_functions::add_constraints(cell, cell1, cell2, String, sheet, status, \u0026mut sleep_timer);\r\n        } else {*status = String::from(\"Invalid cmd\"); }\r\n    }\r\n\r\n    // Cell = int op int\r\n    else if let Some(caps) = re_cell_eq_int_op_int.captures(\u0026command) {\r\n        *time = 0.0;\r\n        let ref_col = caps.get(1).unwrap().as_str();\r\n        let ref_row: i32 = caps.get(2).unwrap().as_str().parse().unwrap();\r\n        let val1: i32 = caps.get(3).unwrap().as_str().parse().unwrap();\r\n        let op = caps.get(4).unwrap().as_str().chars().next().unwrap();\r\n        let val2: i32 = caps.get(5).unwrap().as_str().parse().unwrap();\r\n        let col = col_name_to_col_num(ref_col);\r\n        let row = ref_row - 1;\r\n        if is_valid_cell(row, col, *total_rows, *total_cols) \u0026\u0026 (op == '+' || op == '-' || op == '*' || op == '/') {\r\n            let value;\r\n            let mut calc_error = false; \r\n            if op=='+'{ value = val1 + val2;  }\r\n            else if op =='-'{  value = val1 - val2;  }\r\n            else if op =='*'{  value = val1 * val2;  }\r\n            else{ if val2 == 0 {calc_error=true;  value= -1;}\r\n                else{  value = val1 / val2; }}\r\n\r\n            let cell_entry = get_or_create_cell(sheet, row, col);\r\n            cell_entry.value = value;\r\n            cell_entry.string = None;\r\n            cell_entry.is_error = calc_error;\r\n            \r\n            let cell = CellInfo { row: row as i16, col: col as i16 };\r\n            let cell1 = CellInfo { row: -1, col: -1 };\r\n            let cell2 = CellInfo { row: -1, col: -1 };\r\n            let op_code = NoConstraint;\r\n            sheet_functions::add_constraints(cell, cell1, cell2,op_code, sheet, status, \u0026mut 26self))?,\r\n//                 })\r\n//             }\r\n//         }\r\n\r\n//         deserializer.deserialize_tuple(7, CellVisitor)\r\n//     }\r\n// }\r\n        \r\npub fn get_or_create_cell(sheet: \u0026mut Sheet, row: i32, col: i32) -\u003e \u0026mut Cell {\r\n    sheet.data.entry((row as i16, col as i16)).or_insert_with(|| Cell {\r\n        value: 0,\r\n        is_error: false,\r\n        string: None,\r\n        op_code: OpCode::NoConstraint,\r\n        cell1: CellInfo { row: -1, col: -1 },\r\n        cell2: CellInfo { row: -1, col: -1 },\r\n        dependencies: std::collections::HashSet::new(),\r\n    })\r\n}\r\n// is_valid_cell\r\npub fn is_valid_cell(row: i32, col: i32, total_rows: i32, total_cols: i32) -\u003e bool {\r\n    row \u003e= 0 \u0026\u0026 row \u003c total_rows \u0026\u0026 col \u003e= 0 \u0026\u0026 col \u003c total_cols\r\n}           \r\n\r\n\r\nimpl Sheet {\r\n    pub fn new(rows: i32, cols: i32) -\u003e Self {\r\n        let mut buul = Vec::with_capacity(rows as usize);\r\n\r\n        // Initialize the `buul` vector\r\n        for _ in 0..rows {\r\n            let mut row = Vec::with_capacity(cols as usize);\r\n            for _ in 0..cols {\r\n                row.push(false); // Initialize `buul` with `false`\r\n            }\r\n            buul.push(row);\r\n        }\r\n\r\n        // Initialize the `data` and `tuup` HashMaps as empty\r\n        let data = HashMap::new();\r\n        let tuup = HashMap::new();\r\n        \r\n        Sheet {\r\n            rows,\r\n            cols,\r\n            buul,\r\n            data,\r\n            tuup,\r\n        }\r\n    }\r\n}\r\n\r\n\r\npub fn col_num_to_col_name(col_num: i32) -\u003e String {\r\n    let mut col_name = String::new();\r\n    let mut col_num = col_num;\r\n    while col_num \u003e= 0 {\r\n        let x = ('A' as u8 + (col_num % 26) as  u8) as char;\r\n        col_name.push(x);\r\n        col_num /= 26;\r\n        col_num -= 1;\r\n    }\r\n    col_name = col_name.chars().rev().collect();\r\n    return col_name;\r\n}\r\n\r\npub fn col_name_to_col_num(col_name: \u0026str) -\u003e i32 {\r\n    let mut col  = -1;\r\n    for c in col_name.chars() {\r\n        col = (col + 1) * 26;\r\n        col += (c as u8 - 'A' as u8) as i32;\r\n    }\r\n    return col;\r\n}\r\n  \r\npub fn print_sheet(start_row: i32, start_col: i32, total_rows: i32, total_cols: i32, sheet: \u0026mut Sheet) {\r\n    let max_col_display: i32 = start_col + std::cmp::min(total_cols - start_col, 10);\r\n    let max_row_display: i32 = start_row + std::cmp::min(total_rows - start_row, 10);\r\n    let space: usize = 10;\r\n\r\n    // Print column headers\r\n    print!(\"{:\u003espace$}\", \"\");\r\n    for i in start_col..max_col_display {\r\n        print!(\"{:\u003espace$}\", col_num_to_col_name(i));\r\n    }\r\n    println!();\r\n\r\n    // Print rows\r\n    for i in start_row..max_row_display {\r\n        print!(\"{:\u003espace$}\", i + 1); // Print row header\r\n        for j in start_col..max_col_display {\r\n            if let Some(cell) = sheet.data.get(\u0026(i as i16, j as i16)) {\r\n                // If the cell exists in the map\r\n                if !cell.is_error {\r\n                    if let Some(s) = \u0026cell.string {\r\n                        print!(\"{:\u003espace$}\", s); // Print string value\r\n                    } else {\r\n                        print!(\"{:\u003espace$}\", cell.value); // Print numeric value\r\n                    }\r\n                } else {\r\n                    print!(\"{:\u003espace$}\", \"Err\"); // Print error\r\n                }\r\n            } else {\r\n                // If the cell does not exist in the map, print 0\r\n                print!(\"{:\u003espace$}\", 0);\r\n            }\r\n        }\r\n        println!();\r\n    }\r\n}\r\n\r\npub fn check_cycle(avl_tree: \u0026std::collections::HashMap\u003ci32, i32\u003e,cell1: \u0026CellInfo,cell2: \u0026CellInfo,) -\u003e bool {\r\n    let key1 = cell1.col as i32 * 1000 + cell1.row as i32;\r\n    if avl_tree.contains_key(\u0026key1) {\r\n        return true;\r\n    }\r\n    if cell2.col == -1 \u0026\u0026 cell2.row == -1 {\r\n        return false;\r\n    }\r\n    let key2 = cell2.col as i32 * 1000 + cell2.row as i32;\r\n    if avl_tree.contains_key(\u0026key2) {\r\n        return true;\r\n    }\r\n    false\r\n}\r\npub fn check_cycle_range_funcs(avl_tree: \u0026std::collections::HashMap\u003ci32, i32\u003e, cell1: \u0026CellInfo, cell2: \u0026CellInfo) -\u003e bool {\r\n    for (\u0026key, _) in avl_tree.iter() {\r\n        let col = key / 1000;\r\n        let row = key % 1000;\r\n\r\n        if col \u003e= cell1.col as i32 \u0026\u0026 col \u003c= cell2.col as i32 \u0026\u0026 row \u003e= cell1.row as i32 \u0026\u0026 row \u003c= cell2.row as i32 {\r\n            return true;\r\n        }\r\n    }\r\n    false\r\n}\r\n\r\npub fn recalculate(sheet: \u0026mut Sheet, row: usize, col: usize, sleep_timer: \u0026mut i32) { \r\n    \r\n    let (op_code, cell1, cell2) = {\r\n        let c = sheet.data.get_mut(\u0026(row as i16, col as i16)).expect(\"not in map\");\r\n        (c.op_code, c.cell1.clone(), c.cell2.clone())\r\n    }; \r\n    if op_code == NoConstraint || op_code == String {\r\n        return;\r\n    }\r\n\r\n    // ── 2) Compute the new value, error flag, and any sleep delta using *only* immutable borrows ──\r\n    let (new_value, string_value, is_error, is_error2) = {\r\n        // Immutable borrow of the whole sheet  \r\n        let mut err = false;\r\n        let mut val = 0;\r\n        let mut strval = String::new();\r\n        let mut err1: bool = false;\r\n\r\n        match op_code {\r\n            CellEqualsCell =\u003e {\r\n                let ref_cell = get_or_create_cell(sheet, cell1.row as i32, cell1.col as i32);\r\n                if ref_cell.is_error {\r\n                    err = true;\r\n                }else {\r\n                    if ref_cell.string.is_some(){\r\n                        strval = ref_cell.string.as_ref().unwrap().clone();\r\n                    }else{ \r\n                        val = ref_cell.value; \r\n                    } \r\n                }\r\n            }\r\n            CellPlusCell | CellMinusCell | CellTimesCell | CellDivideCell =\u003e {\r\n                let (a_value, a_is_error, a_string) = {\r\n                    let a = get_or_create_cell(sheet, cell1.row as i32, cell1.col as i32);\r\n                    (a.value, a.is_error, a.string.clone())\r\n                };\r\n                let (b_value, b_is_error, b_string) = {\r\n                    let b = get_or_create_cell(sheet, cell2.row as i32, cell2.col as i32);\r\n                    (b.value, b.is_error, b.string.clone())\r\n                };\r\n                if a_is_error || b_is_error || a_string.is_some() || b_string.is_some() {\r\n                    err = true;\r\n                } else {\r\n                    (val, err1) = compute_cell(op_code, a_value, b_value, \u0026mut String::new());\r\n                }\r\n            }\r\n            CellPlusConstant | CellMinusConstant | CellTimesConstant | CellDivideConstant | ConstantDividesCell =\u003e {\r\n                let a = get_or_create_cell(sheet, cell1.row as i32, cell1.col as i32);\r\n                if a.is_error || a.string.is_some() {\r\n                    err = true;\r\n                } else {\r\n                    (val, err1) = compute_cell(op_code, a.value, (cell2.row as i32) \u003c\u003c 16 | cell2.col as i32, \u0026mut String::new());\r\n                }\r\n            }\r\n            Sleep =\u003e {\r\n                let a = get_or_create_cell(sheet, cell1.row as i32, cell1.col as i32);\r\n                if a.is_error || a.string.is_some() {\r\n                    err = true;\r\n                } else {\r\n                    val = a.value;\r\n                    *sleep_timer += val;\r\n                }\r\n            }\r\n            Sum | Min | Max | Avg | Stdev =\u003e {\r\n                // range check \r\n                    for i in cell1.row..=cell2.row {\r\n                        for j in cell1.col..=cell2.col {\r\n                            if let Some(ref_cell) = sheet.data.get(\u0026(i as i16, j as i16)) {\r\n                                if ref_cell.is_error || ref_cell.string.is_some() {\r\n                                    err = true;\r\n                                    break;\r\n                                }\r\n                            }\r\n                        }\r\n                        if err { break; }\r\n                    }\r\n                     \r\n                    if !err{\r\n                        val = compute_range_func(\r\n                            sheet, op_code,\r\n                            cell1.row as i16, cell1.col as i16,\r\n                            cell2.row as i16, cell2.col as i16,\r\n                            \u0026mut String::new()\r\n                        );\r\n                    }\r\n                    \r\n            }\r\n            _ =\u003e {}\r\n        }\r\n        (val,strval,err, err1)\r\n    };\r\n    {\r\n        let c = get_or_create_cell(sheet, row as i32, col as i32); \r\n        c.is_error = is_error;\r\n        if is_error2 == true {\r\n            c.is_error = true;\r\n        }\r\n        else {\r\n            if op_code == CellEqualsCell \u0026\u0026 string_value != \"\" {\r\n                c.string = Some(string_value.clone());\r\n            } else{\r\n                c.value  = new_value; \r\n                c.string = None;\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\n\r\n\r\npub fn topological_sort(avl_tree: \u0026mut std::collections::HashMap\u003ci32, i32\u003e, sheet: \u0026Sheet) -\u003e Vec\u003ci32\u003e {\r\n    let mut queue = std::collections::VecDeque::new();\r\n    let mut result = Vec::new();\r\n\r\n    // Find nodes with indegree 0\r\n    for (\u0026key, \u0026value) in avl_tree.iter() {\r\n        if value == 0 {\r\n            queue.push_back(key);\r\n        }\r\n    }\r\n\r\n    while let Some(node) = queue.pop_front() {\r\n        result.push(node);\r\n\r\n        for \u0026dep in \u0026sheet.data.get(\u0026((node % 1000) as i16, (node / 1000 )as i16)).expect(\"not in map\").dependencies {\r\n            if let Some(indegree) = avl_tree.get_mut(\u0026dep) {\r\n            *indegree -= 1;\r\n            if *indegree == 0 {\r\n                queue.push_back(dep);\r\n            }\r\n            }\r\n        }\r\n        // get the range dependencies\r\n        let (row,col) = (node % 1000, node / 1000);\r\n        if sheet.buul[row as usize][col as usize] {\r\n            for (((start_col,start_row),(end_col,end_row)), target_vector) in sheet.tuup.iter() {\r\n                for (target_col, target_row) in target_vector {\r\n                    if col \u003e= *start_col as i32 \u0026\u0026 col \u003c= *end_col as i32 \u0026\u0026 row \u003e= *start_row as i32 \u0026\u0026 row \u003c= *end_row as i32 {\r\n                        let key = *target_col as i32 * 1000 + *target_row as i32;\r\n                        if let Some(indegree) = avl_tree.get_mut(\u0026key) {\r\n                            *indegree -= 1;\r\n                            if *indegree == 0 {\r\n                                queue.push_back(key);\r\n                            }\r\n                        }\r\n                    }\r\n                }\r\n            }\r\n        }\r\n\r\n\r\n        \r\n\r\n    }\r\n\r\n    result\r\n} \r\n\r\nuse OpCode::*;\r\n\r\npub fn remove_dependency(cell: \u0026CellInfo, sheet: \u0026mut Sheet) {\r\n    let row = cell.row as i32;\r\n    let col = cell.col as i32;\r\n\r\n    // Check if the current cell exists in the map\r\n    let (op_code, cell1, cell2) = if let Some(curr_cell) = sheet.data.get(\u0026(row as i16, col as i16)) {\r\n        (curr_cell.op_code, curr_cell.cell1.clone(), curr_cell.cell2.clone())\r\n    } else {\r\n        // If the cell is not in the map, return early\r\n        return;\r\n    };\r\n\r\n    match op_code {\r\n        OpCode::NoConstraint =\u003e {}\r\n        OpCode::CellEqualsCell| OpCode::CellPlusConstant| OpCode::CellTimesConstant| OpCode::CellMinusConstant| OpCode::CellDivideConstant| OpCode::ConstantDividesCell| OpCode::Sleep =\u003e {\r\n            if let Some(dependent_cell) = sheet.data.get_mut(\u0026(cell1.row as i16, cell1.col as i16)) {\r\n                dependent_cell.dependencies.remove(\u0026(col * 1000 + row));\r\n            } \r\n        }\r\n        OpCode::Sum | OpCode::Min | OpCode::Max | OpCode::Avg | OpCode::Stdev =\u003e {\r\n            // Handle range dependencies\r\n            if let Some(vec) = sheet.tuup.get_mut(\u0026((cell1.col, cell1.row), (cell2.col, cell2.row))) {\r\n                vec.retain(|\u0026(col, row)| col != cell.col || row != cell.row);\r\n                if vec.is_empty() {\r\n                    sheet.tuup.remove(\u0026((cell1.col, cell1.row), (cell2.col, cell2.row)));\r\n                }\r\n            }\r\n            for i in cell1.row..=cell2.row {\r\n                for j in cell1.col..=cell2.col {\r\n                    let mut flag = false;\r\n                    // check present in other range functions\r\n                    for(((start_col,start_row),(end_col,end_row)), _) in sheet.tuup.iter() {\r\n                        if j \u003e= *start_col \u0026\u0026 j \u003c= *end_col \u0026\u0026 i \u003e= *start_row \u0026\u0026 i \u003c= *end_row {\r\n                            flag = true;\r\n                        }\r\n                    }\r\n                    sheet.buul[i as usize][j as usize] = flag; // Mark the cell as not used\r\n                }\r\n            }\r\n        }\r\n        OpCode::CellPlusCell| OpCode::CellMinusCell| OpCode::CellTimesCell| OpCode::CellDivideCell =\u003e {\r\n            if let Some(dependent_cell1) = sheet.data.get_mut(\u0026(cell1.row as i16, cell1.col as i16)) {\r\n                dependent_cell1.dependencies.remove(\u0026(col * 1000 + row));\r\n            }\r\n\r\n            if let Some(dependent_cell2) = sheet.data.get_mut(\u0026(cell2.row as i16, cell2.col as i16)) {\r\n                dependent_cell2.dependencies.remove(\u0026(col * 1000 + row));\r\n            }\r\n        }\r\n        _ =\u003e {}\r\n    }\r\n    // Update the current cell to reset its dependencies\r\n    if let Some(curr_cell) = sheet.data.get_mut(\u0026(row as i16, col as i16)) {\r\n        curr_cell.cell1 = CellInfo { row: -1, col: -1 };\r\n        curr_cell.cell2 = CellInfo { row: -1, col: -1 };\r\n    }\r\n}\r\n\r\npub fn add_to_tree(avl_tree: \u0026mut std::collections::HashMap\u003ci32, i32\u003e, cell: CellInfo, sheet: \u0026Sheet) {\r\n    // Get the current cell from the HashMap\r\n    if let Some(curr_cell) = sheet.data.get(\u0026(cell.row as i16, cell.col as i16)) {\r\n        for \u0026curr in \u0026curr_cell.dependencies {\r\n            if !avl_tree.contains_key(\u0026curr) {\r\n                avl_tree.insert(curr, 1);\r\n                let temp = CellInfo {\r\n                    row: (curr % 1000) as i16,\r\n                    col: (curr / 1000) as i16,\r\n                };\r\n                add_to_tree(avl_tree, temp, sheet);\r\n            } else {\r\n                *avl_tree.entry(curr).or_insert(1) += 1;\r\n            }\r\n        }\r\n    }// check range dependency\r\n    if sheet.buul[cell.row as usize][cell.col as usize]{\r\n        // range dependency is there\r\n        for (((start_col,start_row),(end_col,end_row)), target_vector) in sheet.tuup.iter() {\r\n\r\n            for (target_col, target_row) in target_vector {\r\n            if cell.col \u003e= *start_col \u0026\u0026 cell.col \u003c= *end_col \u0026\u0026 cell.row \u003e= *start_row \u0026\u0026 cell.row \u003c= *end_row {\r\n               // dependent\r\n                let key = *target_col as i32 * 1000 + *target_row as i32;\r\n                if !avl_tree.contains_key(\u0026key) {\r\n                    avl_tree.insert(key, 1);\r\n                    let temp = CellInfo {\r\n                        row: *target_row,\r\n                        col: *target_col,\r\n                    };\r\n                    add_to_tree(avl_tree, temp, sheet);\r\n                } else {\r\n                    *avl_tree.entry(key).or_insert(1) += 1;\r\n                }\r\n            }\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\npub fn add_constraints(curr_cell: CellInfo,cell1: CellInfo,cell2: CellInfo,op_code: OpCode,sheet: \u0026mut Sheet,status: \u0026mut String,sleep_timer: \u0026mut i32,) {\r\n    let key = curr_cell.col as i32 * 1000 + curr_cell.row as i32;\r\n    let mut ans = 0;\r\n    let mut calc_error = false;\r\n    let mut calc_error1 = false;\r\n    let mut stringans = String::new();\r\n    // Create a HashMap named avl_tree where the key is key and the value is indegree (0 by default)\r\n    let mut avl_tree: std::collections::HashMap\u003ci32, i32\u003e = std::collections::HashMap::new();\r\n    avl_tree.insert(key, 0);\r\n    let temp = CellInfo { row: -1, col: -1 };\r\n\r\n    add_to_tree(\u0026mut avl_tree, curr_cell.clone(), sheet); \r\n\r\n    match op_code {\r\n        OpCode::NoConstraint | String =\u003e {remove_dependency(\u0026curr_cell, sheet);\r\n            let cell = get_or_create_cell(sheet, curr_cell.row as i32, curr_cell.col as i32); \r\n                ans = cell.value;\r\n                if cell.is_error {calc_error = true;}\r\n                cell.op_code = op_code;\r\n                cell.cell1 = CellInfo { row: -1, col: -1 };\r\n                cell.cell2 = CellInfo { row: -1, col: -1 }; \r\n        }\r\n        OpCode::CellEqualsCell =\u003e {\r\n            if check_cycle(\u0026avl_tree, \u0026cell1, \u0026temp) {\r\n                *status = String::from(\"circular error\");return;\r\n            }\r\n            remove_dependency(\u0026curr_cell, sheet);\r\n            let cell = get_or_create_cell(sheet, curr_cell.row as i32, curr_c 0), \"A\");\r\n        assert_eq!(col_num_to_col_name(25), \"Z\");\r\n        assert_eq!(col_num_to_col_name(26), \"AA\");\r\n        assert_eq!(col_num_to_col_name(27), \"AB\");\r\n    }\r\n\r\n    #[test]\r\n    fn test_cell_validity() {\r\n        assert!(is_valid_cell(0, 0, 10, 10));\r\n        assert!(is_valid_cell(9, 9, 10, 10));\r\n        assert!(!is_valid_cell(10, 9, 10, 10));\r\n        assert!(!is_valid_cell(9, 10, 10, 10));\r\n        assert!(!is_valid_cell(-1, 0, 10, 10));\r\n    }\r\n\r\n    // Cell Management Tests\r\n    #[test]\r\n    fn test_get_or_create_cell() {\r\n        let mut sheet = create_test_sheet();\r\n        \r\n        let cell = get_or_create_cell(\u0026mut sheet, 1, 1);\r\n        assert_eq!(cell.value, 0);\r\n        assert!(!cell.is_error);\r\n        assert_eq!(cell.string, None);\r\n        assert_eq!(cell.op_code, OpCode::NoConstraint);\r\n        \r\n        cell.value = 42;\r\n        \r\n        let cell2 = get_or_create_cell(\u0026mut sheet, 1, 1);\r\n        assert_eq!(cell2.value, 42);\r\n    }\r\n\r\n    // Mathematical Function Tests\r\n    #[test]\r\n    fn test_sum_function() {\r\n        let mut sheet = create_test_sheet();\r\n        \r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n        get_or_create_cell(\u0026mut sheet, 1, 0).value = 30;\r\n        get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n        let result = sum(\u0026sheet, 0, 0, 1, 1);\r\n        assert_eq!(result, 100);\r\n    }\r\n\r\n    #[test]\r\n    fn test_min_function() {\r\n        let mut sheet = create_test_sheet();\r\n        \r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 5;\r\n        get_or_create_cell(\u0026mut sheet, 1, 0).value = 30;\r\n        get_or_create_cell(\u0026mut sheet, 1, 1).value = 15;\r\n        \r\n        let result = min(\u0026sheet, 0, 0, 1, 1);\r\n        assert_eq!(result, 5);\r\n    }\r\n\r\n    #[test]\r\n    fn test_max_function() {\r\n        let mut sheet = create_test_sheet();\r\n        \r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n        get_or_create_cell(\u0026mut sheet, 1, 0).value = 30;\r\n        get_or_create_cell(\u0026mut sheet, 1, 1).value = 15;\r\n        \r\n        let result = max(\u0026sheet, 0, 0, 1, 1);\r\n        assert_eq!(result, 30);\r\n    }\r\n\r\n    #[test]\r\n    fn test_avg_function() {\r\n        let mut sheet = create_test_sheet();\r\n        \r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n        get_or_create_cell(\u0026mut sheet, 1, 0).value = 30;\r\n        get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n        let result = avg(\u0026sheet, 0, 0, 1, 1);\r\n        assert_eq!(result, 25); // (10+20+30+40)/4 = 25\r\n    }\r\n\r\n    #[test]\r\n    fn test_stdev_function() {\r\n        let mut sheet = create_test_sheet();\r\n        \r\n        // Uniform values (standard deviation should be 0)\r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 1, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 1, 1).value = 10;\r\n        \r\n        let result = stdev(\u0026sheet, 0, 0, 1, 1);\r\n        assert_eq!(result, 0);\r\n        \r\n        // Mixed values\r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n        get_or_create_cell(\u0026mut sheet, 1, 0).value = 30;\r\n        get_or_create_cell(\u0026mut sheet, 1, 1).value = 40;\r\n        \r\n        let result = stdev(\u0026sheet, 0, 0, 1, 1);\r\n        assert_eq!(result, 11); // sqrt((sum((x-avg)^2)/n)) ≈ 13\r\n    }\r\n\r\n    // Cell Computation Tests\r\n    #[test]\r\n    fn test_compute_cell() {\r\n        let mut status = String::new();\r\n        \r\n        // Addition\r\n        let (result, error) = compute_cell(OpCode::CellPlusCell, 10, 20, \u0026mut status);\r\n        assert_eq!(result, 30);\r\n        assert!(!error);\r\n        \r\n        // Subtraction\r\n        let (result, error) = compute_cell(OpCode::CellMinusCell, 30, 10, \u0026mut status);\r\n        assert_eq!(result, 20);\r\n        assert!(!error);\r\n        \r\n        // Multiplication\r\n        let (result, error) = compute_cell(OpCode::CellTimesCell, 5, 4, \u0026mut status);\r\n        assert_eq!(result, 20);\r\n        assert!(!error);\r\n        \r\n        // Division\r\n        let (result, error) = compute_cell(OpCode::CellDivideCell, 20, 5, \u0026mut status);\r\n        assert_eq!(result, 4);\r\n        assert!(!error);\r\n        \r\n        // Division by zero\r\n        let (result, error) = compute_cell(OpCode::CellDivideCell, 20,0,\u0026mut status);\r\n        assert_eq!(result, -1);\r\n        assert!(error);\r\n\r\n        // \r\n        let (result, error) = compute_cell(OpCode::ConstantDividesCell, 0,20,\u0026mut status);\r\n        assert_eq!(result, -1);\r\n        assert!(error);\r\n\r\n        let (result, error) = compute_cell(OpCode::ConstantDividesCell, 20,20,\u0026mut status);\r\n        assert_eq!(result, 1);\r\n        assert!(error);\r\n\r\n        let (result, error) = compute_cell(OpCode::String, 20,0,\u0026mut status);\r\n        assert_eq!(result, 20);\r\n        assert!(error);\r\n\r\n        let (result, error) = compute_cell(OpCode::Sleep, 20,0,\u0026mut status);\r\n        assert_eq!(result, -1);\r\n        assert!(error);\r\n    }\r\n\r\n    // OpCode Tests\r\n    #[test]\r\n    fn test_get_op_code() {\r\n        assert_eq!(get_op_code('+', false), OpCode::CellPlusConstant);\r\n        assert_eq!(get_op_code('-', false), OpCode::CellMinusConstant);\r\n        assert_eq!(get_op_code('*', false), OpCode::CellTimesConstant);\r\n        assert_eq!(get_op_code('/', false), OpCode::CellDivideConstant);\r\n        assert_eq!(get_op_code('/', true), OpCode::ConstantDividesCell);\r\n        assert_eq!(get_op_code('x', false), OpCode::NoConstraint);\r\n    }\r\n\r\n    #[test]\r\n    fn test_get_op_code2() {\r\n        assert_eq!(get_op_code2('+'), OpCode::CellPlusCell);\r\n        assert_eq!(get_op_code2('-'), OpCode::CellMinusCell);\r\n        assert_eq!(get_op_code2('*'), OpCode::CellTimesCell);\r\n        assert_eq!(get_op_code2('/'), OpCode::CellDivideCell);\r\n        assert_eq!(get_op_code2('x'), OpCode::NoConstraint);\r\n    }\r\n\r\n    #[test]\r\n    fn test_func_to_op_code() {\r\n        assert_eq!(func_to_op_code(\"SUM\"), OpCode::Sum);\r\n        assert_eq!(func_to_op_code(\"MIN\"), OpCode::Min);\r\n        assert_eq!(func_to_op_code(\"MAX\"), OpCode::Max);\r\n        assert_eq!(func_to_op_code(\"AVG\"), OpCode::Avg);\r\n        assert_eq!(func_to_op_code(\"STDEV\"), OpCode::Stdev);\r\n        assert_eq!(func_to_op_code(\"UNKNOWN\"), OpCode::NoConstraint);\r\n    }\r\n\r\n    // Cell Dependency Tests\r\n    #[test]\r\n    fn test_add_constraints_simple() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut status = String::new();\r\n        let mut sleep_timer = 0;\r\n        \r\n        // Set A1 = 10\r\n        let cell = CellInfo { row: 0, col: 0 };\r\n        let cell1 = CellInfo { row: -1, col: -1 };\r\n        let cell2 = CellInfo { row: -1, col: -1 };\r\n        \r\n        get_or_create_cell(\u0026mut sheet, 0, 0).value = 10;\r\n        add_constraints(cell, cell1, cell2, OpCode::NoConstraint, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n        \r\n        assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 10);\r\n        assert_eq!(status, \"ok\");\r\n    }\r\n\r\n    #[test]\r\n    fn test_add_constraints_cell_equals_cell() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut status = String::new();\r\n        let mut sleep_timer = 0;\r\n        \r\n        // Set B1 = 20\r\n        get_or_create_cell(\u0026mut sheet, 0, 1).value = 20;\r\n        \r\n        // Set A1 = B1\r\n        let cell = CellInfo { row: 0, col: 0 };\r\n        let cell1 = CellInfo { row: 0, col: 1 };\r\n        let cell2 = CellInfo { row: -1, col: -1 };\r\n        \r\n        add_constraints(cell, cell1, cell2, OpCode::CellEqualsCell, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n        \r\n        assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 20);\r\n        assert_eq!(status, \"ok\");\r\n        assert!(sheet.data.get(\u0026(0, 1)).unwrap().dependencies.contains(\u0026(0 * 1000 + 0)));\r\n    }\r\n\r\n    #[test]\r\n    fn test_circular_dependency() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut status = String::new();\r\n        let mut sleep_timer = 0;\r\n    \r\n        // Set A1 = B1\r\n        let cell_a1 = CellInfo { row: 0, col: 0 };\r\n        let cell_b1 = CellInfo { row: 0, col: 1 };\r\n        let empty = CellInfo { row: -1, col: -1 };\r\n    \r\n        add_constraints(cell_a1, cell_b1, empty, OpCode::CellEqualsCell, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n        \r\n        // Try to create circular reference: B1 = A1\r\n        status = String::new();\r\n        let cell_b1 = CellInfo { row: 0, col: 1 };\r\n        let cell_a1 = CellInfo { row: 0, col: 0 };\r\n        let empty = CellInfo { row: -1, col: -1 };\r\n        add_constraints(cell_b1, cell_a1, empty, OpCode::CellEqualsCell, \u0026mut sheet, \u0026mut status, \u0026mut sleep_timer);\r\n    \r\n        assert_eq!(status, \"circular error\");\r\n    }\r\n\r\n    // Parser Tests\r\n    #[test]\r\n    fn test_parse_command_simple_assignment() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut row_start = 0;\r\n        let mut col_start = 0;\r\n        let mut time = 0.0;\r\n        let mut status = String::from(\"ok\");\r\n        let total_rows = 10;\r\n        let total_cols = 10;\r\n        let mut print_enabled = true;\r\n        \r\n        // Test A1=42\r\n        parse_command(\"A1=42\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        \r\n        assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().value, 42);\r\n        assert_eq!(status, \"ok\");\r\n    }\r\n\r\n    #[test]\r\n    fn test_parse_command_cell_operations() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut row_start = 0;\r\n        let mut col_start = 0;\r\n        let mut time = 0.0;\r\n        let mut status = String::new();\r\n        let total_rows = 10;\r\n        let total_cols = 10;\r\n        let mut print_enabled = true;\r\n        \r\n        // Set up cells\r\n        parse_command(\"A1=10\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        parse_command(\"B1=20\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        \r\n        // C1=A1+B1\r\n        parse_command(\"C1=A1+B1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(0, 2)).unwrap().value, 30);\r\n        \r\n        // D1=B1-A1\r\n        parse_command(\"D1=B1-A1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(0, 3)).unwrap().value, 10);\r\n        \r\n        // E1=A1*B1\r\n        parse_command(\"E1=A1*B1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(0, 4)).unwrap().value, 200);\r\n        \r\n        // F1=B1/A1\r\n        parse_command(\"F1=B1/A1\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(0, 5)).unwrap().value, 2);\r\n    }\r\n\r\n    #[test]\r\n    fn test_parse_command_functions() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut row_start = 0;\r\n        let mut col_start = 0;\r\n        let mut time = 0.0;\r\n        let mut status = String::new();\r\n        let total_rows = 10;\r\n        let total_cols = 10;\r\n        let mut print_enabled = true;\r\n        \r\n        // Set up cells\r\n        parse_command(\"A1=10\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        parse_command(\"A2=20\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        parse_command(\"B1=30\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        parse_command(\"B2=40\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        \r\n        // Test SUM function\r\n        parse_command(\"C1=SUM(A1:B2)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(0, 2)).unwrap().value, 100);\r\n        \r\n        // Test MIN function\r\n        parse_command(\"C2=MIN(A1:B2)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(1, 2)).unwrap().value, 10);\r\n        \r\n        // Test MAX function\r\n        parse_command(\"C3=MAX(A1:B2)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(2, 2)).unwrap().value, 40);\r\n        \r\n        // Test AVG function\r\n        parse_command(\"C4=AVG(A1:B2)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(3, 2)).unwrap().value, 25);\r\n        \r\n        // Test STDEV function\r\n        parse_command(\"C5=STDEV(A1:B2)\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(sheet.data.get(\u0026(4, 2)).unwrap().value, 11);\r\n    }\r\n\r\n    #[test]\r\n    fn test_parse_command_string_cells() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut row_start = 0;\r\n        let mut col_start = 0;\r\n        let mut time = 0.0;\r\n        let mut status = String::new();\r\n        let total_rows = 10;\r\n        let total_cols = 10;\r\n        let mut print_enabled = true;\r\n        \r\n        // Test string assignment\r\n        parse_command(\"A1=\\\"Hello\\\"\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        \r\n        assert_eq!(sheet.data.get(\u0026(0, 0)).unwrap().string, Some(\"Hello\".to_string()));\r\n        assert_eq!(status, \"ok\");\r\n    }\r\n\r\n    #[test]\r\n    fn test_navigation_commands() {\r\n        let mut sheet = create_test_sheet();\r\n        let mut row_start = 0;\r\n        let mut col_start = 0;\r\n        let mut time = 0.0;\r\n        let mut status = String::new();\r\n        let total_rows = 20;\r\n        let total_cols = 20;\r\n        let mut print_enabled = true;\r\n        \r\n        // Test scroll commands\r\n        parse_command(\"s\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(row_start, 10);\r\n        \r\n        parse_command(\"w\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(row_start, 0);\r\n        \r\n        parse_command(\"d\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(col_start, 10);\r\n        \r\n        parse_command(\"a\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(col_start, 0);\r\n        \r\n        // Test scroll_to command\r\n        parse_command(\"scroll_toB5\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!(row_start, 4);\r\n        assert_eq!(col_start, 1);\r\n\r\n        parse_command(\"scroll_toZZZ9991\", \u0026mut row_start, \u0026mut col_start, \u0026mut time, \u0026mut status, \u0026total_rows, \u0026total_cols, \u0026mut sheet, \u0026mut print_enabled);\r\n        assert_eq!\r\n\r\n\r\n    }\r\n\r\n    // Advanced Tests\r\n    // #[test]\r\n    // fn te
